const VOL = { music:0.5, laser:0.7, boss:0.7, robot:0.6 };
function playTone(freq, duration, volume, type='square', slideTo=null){
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type==='noise' ? 'triangle' : type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime+duration);
        g.gain.setValueAtTime(Math.max(0.0001,volume), audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime+duration);
    } catch(e){}
}

// ---------------- DAMAGE HELPERS (shield -> dodge -> immortal aware) ----------------
function damagePlayerHit(amount, sourceIsAttack=true){
    const p = G.player;
    if (p.immortal || (G.admin && G.admin.god)) return 0;
    if (sourceIsAttack && p.abilities.dodgeUnlocked && p.abilities.dodgeCd <= 0) {
        if (Math.random() < 0.10) { p.abilities.dodgeCd = 15.0; sfx.dodge(); return 0; }
        p.abilities.dodgeCd = 10.0;
    }
    let a = amount;
    if (p.shield > 0) { const absorb = Math.min(p.shield, a); p.shield -= absorb; a -= absorb; if (absorb > 0) p.shieldHit = Math.max(p.shieldHit || 0, absorb > 1 ? 0.3 : 0.1); }
    p.hp -= a;
    if (a > 0) p.hitFlash = 0.22;
    return a;
}
function damagePlayerTick(amount){
    const p = G.player;
    if (G.admin && G.admin.god) return 0;
    if (p.immortal) return 0;
    let a = amount;
    if (p.shield > 0) { const absorb = Math.min(p.shield, a); p.shield -= absorb; a -= absorb; if (absorb > 0) p.shieldHit = Math.max(p.shieldHit || 0, absorb > 1 ? 0.3 : 0.1); }
    p.hp -= a;
    if (a > 0) p.hitFlash = Math.max(p.hitFlash, 0.08);
    return a;
}
function gainOmp(amount){
    const p = G.player;
    const total = Math.round(amount * (1 + (p.abilities.moneyBonusPct||0)));

}

function facingVector(facing){
    if (facing === "right") return {x:1,y:0};
    if (facing === "left") return {x:-1,y:0};
    if (facing === "front") return {x:0,y:1};
    return {x:0,y:-1}; // back
}

function pollInput(){
    let ax=0, ay=0;
    if (keys['KeyA']||keys['ArrowLeft']) ax -= 1;
    if (keys['KeyD']||keys['ArrowRight']) ax += 1;
    if (keys['KeyW']||keys['ArrowUp']) ay -= 1;
    if (keys['KeyS']||keys['ArrowDown']) ay += 1;
    if (touchAxis.active) { ax = touchAxis.x; ay = touchAxis.y; }
    I.x = ax; I.y = ay;
    I.fire = keys['KeyF'] || mousePressed || touchFire;
    if (Math.abs(ax) < 0.15 && Math.abs(ay) < 0.15) return;
    if (Math.abs(ax) >= Math.abs(ay)) { I.facing = ax>0 ? "right" : "left"; I.aimDir = ax>0 ? 1 : -1; }
    else I.facing = ay>0 ? "front" : "back";
}



// ---------------- UTIL ----------------
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
function showMessage(txt, sec){ G.message = txt; G.messageTimer = sec; }
function screenShakeKick(amt=1.5){ G.screenShake = amt; }
function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
    r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
    return `rgb(${r},${g},${b})`;
}
function drawText(txt, size, color, x, y, center=false, isBold=true){
    ctx.fillStyle = "#000000";
    ctx.font = `${isBold?'bold ':''}${size}px Consolas`;
    ctx.textAlign = center ? "center" : "left";
    ctx.fillText(txt, x+2, y+2);
    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
}
function wrapCanvasText(txt, font, maxWidth){
    ctx.font = font;
    const words = txt.split(' ');
    const lines = []; let cur = '';
    for (const w of words) {
        const trial = (cur + ' ' + w).trim();
        if (ctx.measureText(trial).width > maxWidth && cur) { lines.push(cur); cur = w; }
        else cur = trial;
    }
    if (cur) lines.push(cur);
    return lines;
}
function drawVGradient(x,y,w,h,topC,botC,radius=0,stroke=null){
    if (w<=0||h<=0) return;
    ctx.save();
    if (radius>0) { ctx.beginPath(); ctx.roundRect(x,y,w,h,radius); ctx.clip(); }
    const grad = ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,topC); grad.addColorStop(1,botC);
    ctx.fillStyle = grad; ctx.fillRect(x,y,w,h);
    ctx.restore();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; if (radius>0) { ctx.beginPath(); ctx.roundRect(x,y,w,h,radius); ctx.stroke(); } else ctx.strokeRect(x,y,w,h); }
}
// overhead "stage light" — a soft highlight across the top of a silhouette,
// doubling as literal theater lighting thematically. Applied after a
// character is fully drawn, so it reads as light falling ON the shape.
function drawShadow(x,y,w){
    const grad = ctx.createRadialGradient(x,y-6,0,x,y-6,w*0.6);
    grad.addColorStop(0,"rgba(0,0,0,0.5)"); grad.addColorStop(0.7,"rgba(0,0,0,0.22)"); grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(x,y-6,w*0.6,10,0,0,7); ctx.fill();
}
// a proper weighted gait instead of a flat sine wobble: legs swing with a
// fundamental + a light second harmonic (asymmetric contact/recoil, not a
// perfect mirror), and the body dips slightly at each footfall
function walkCycle(phase, legAmp=6, bobAmp=2){
    const s = Math.sin(phase), s2 = Math.sin(phase*2);
    return { leg: s*legAmp + s2*legAmp*0.18, bob: Math.abs(s)*bobAmp };
}
// pip-style bar: small rectangles that vanish as the stat drops, instead of a
// numeric/gradient bar.
function drawPipBar(x, y, w, h, current, max, count, colorFull, colorEmpty, gap=2){
    if (max <= 0) return;
    const segW = (w - gap*(count-1)) / count;
    const filled = Math.round(clamp(current/max,0,1) * count);
    for (let i=0;i<count;i++){
        ctx.fillStyle = i < filled ? colorFull : colorEmpty;
        ctx.fillRect(x + i*(segW+gap), y, segW, h);
    }
}

// ---------------- MAZE ----------------
const MAZE_COLS = 13, MAZE_ROWS = 13, MAZE_CELL = 160;

function generateMaze(){
    const cols = MAZE_COLS, rows = MAZE_ROWS;
    // visited[r][c], open connections stored as a Set of "r,c,dir"
    const visited = Array.from({length:rows}, () => Array(cols).fill(false));
    const open = new Set(); // "r1,c1-r2,c2" both directions stored
    function key(r1,c1,r2,c2){ return `${r1},${c1}-${r2},${c2}`; }
    function carve(r,c){
        visited[r][c] = true;
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (let i=dirs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
        for (const [dr,dc] of dirs) {
            const nr=r+dr, nc=c+dc;
            if (nr<0||nc<0||nr>=rows||nc>=cols||visited[nr][nc]) continue;
            open.add(key(r,c,nr,nc)); open.add(key(nr,nc,r,c));
            carve(nr,nc);
        }
    }
    carve(Math.floor(rows/2), Math.floor(cols/2));

    // collect all floor cells for placing props, skip the entry cell
    const entryCell = { r: Math.floor(rows/2), c: Math.floor(cols/2) };
    const floorCells = [];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) if (!(r===entryCell.r && c===entryCell.c)) floorCells.push({r,c});
    for (let i=floorCells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [floorCells[i],floorCells[j]]=[floorCells[j],floorCells[i]]; }

    const cellWorld = (r,c) => ({ x: (c-cols/2+0.5)*MAZE_CELL, y: (r-rows/2+0.5)*MAZE_CELL });

    let idx = 0;
    const chests = [];
    for (let i=0;i<8;i++) { const cell = floorCells[idx++]; const wp = cellWorld(cell.r,cell.c); chests.push({ ...wp, opened:false, hasLoot: Math.random() < rnd(0.25,0.75), lootType: ["potion","omp","key"][Math.floor(Math.random()*3)] }); }
    // guarantee the maze is always solvable: force at least one real key
    if (!chests.some(c => c.hasLoot && c.lootType === "key")) {
        const pick = chests[Math.floor(Math.random()*chests.length)];
        pick.hasLoot = true; pick.lootType = "key";
    }
    const closets = [];
    for (let i=0;i<6;i++) { const cell = floorCells[idx++]; const wp = cellWorld(cell.r,cell.c); closets.push({ ...wp }); }
    const machineCell = floorCells[idx++]; const machineWp = cellWorld(machineCell.r, machineCell.c);
    const machines = [{ ...machineWp, tierKey: ["rare","epic","ultraEpic"][Math.floor(Math.random()*3)] }];
    const exitCell = floorCells[floorCells.length-1]; const exitWp = cellWorld(exitCell.r, exitCell.c);

    // wall segments: for every non-open neighbor pair, a wall rect between them
    const walls = [];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
        const p0 = cellWorld(r,c);
        if (c<cols-1 && !open.has(key(r,c,r,c+1))) walls.push({ x:p0.x+MAZE_CELL/2, y:p0.y, w:8, h:MAZE_CELL, colorSeed:(r*7+c*3)%5 });
        if (r<rows-1 && !open.has(key(r,c,r+1,c))) walls.push({ x:p0.x, y:p0.y+MAZE_CELL/2, w:MAZE_CELL, h:8, colorSeed:(r*3+c*7)%5 });
    }
    // outer border
    const half = { x: cols*MAZE_CELL/2, y: rows*MAZE_CELL/2 };
    walls.push({x:0,y:-half.y-4,w:cols*MAZE_CELL+16,h:8,colorSeed:1}, {x:0,y:half.y+4,w:cols*MAZE_CELL+16,h:8,colorSeed:2});
    walls.push({x:-half.x-4,y:0,w:8,h:rows*MAZE_CELL+16,colorSeed:3}, {x:half.x+4,y:0,w:8,h:rows*MAZE_CELL+16,colorSeed:4});

    const startWp = cellWorld(entryCell.r, entryCell.c);
    G.player.ax = startWp.x; G.player.ay = startWp.y;

    G.maze = {
        cols, rows, open, cellWorld, walls, chests, closets, machines,
        exit: { ...exitWp, locked: true },
        monster: { x: cellWorld(rows-1,cols-1).x, y: cellWorld(rows-1,cols-1).y, state:"patrol",
                   targetX:0, targetY:0, retargetTimer:1.0, tentacles:[], tentacleTimer:8.0, currentSpeed:0 },
        hidingAt: null, sealedWalls: [],
    };
    showMessage("СЕКЦИЯ: ЛАБИРИНТ — ТЬМА ЖДЁТ", 3.0);
}

function mazeCellAt(x,y){
    const m = G.maze;
    const c = Math.floor(x/MAZE_CELL + m.cols/2), r = Math.floor(y/MAZE_CELL + m.rows/2);
    return { r: clamp(r,0,m.rows-1), c: clamp(c,0,m.cols-1) };
}

function updateMaze(dt){
    const p = G.player, m = G.maze; if (!m) return;
    if (G.machineMenu) { updateMachineMenu(dt); return; }

    if (m.hidingAt) {
        // hidden in a closet: safe, but nearly blind — a small vision circle only
        if (I.interact) { m.hidingAt = null; I.interact = false; }
        return;
    }

    let nextX = p.ax + I.x*p.speed*1.5, nextY = p.ay + I.y*p.speed*1.5;
    for (const w of m.walls) if (Math.abs(nextX-w.x) < w.w/2+16 && Math.abs(nextY-w.y) < w.h/2+16) { nextX = p.ax; nextY = p.ay; }
    for (const w of m.sealedWalls) if (w.timer>0 && Math.abs(nextX-w.x) < w.w/2+16 && Math.abs(nextY-w.y) < w.h/2+16) { nextX = p.ax; nextY = p.ay; }
    p.ax = nextX; p.ay = nextY;

    if (I.interact) {
        for (const cl of m.closets) if (Math.hypot(p.ax-cl.x, p.ay-cl.y) < 40) { m.hidingAt = cl; I.interact = false; showMessage("ТЫ ПРЯЧЕШЬСЯ В ШКАФУ", 1.2); }
        for (const ch of m.chests) if (!ch.opened && Math.hypot(p.ax-ch.x, p.ay-ch.y) < 45) {
            ch.opened = true; I.interact = false;
            if (ch.hasLoot) {
                if (ch.lootType === "omp") { gainOmp(20+Math.floor(Math.random()*30)); showMessage("В СУНДУКЕ: ОМП!", 1.4); }
                else if (ch.lootType === "key") { p.inventory.keys++; sfx.good(); showMessage("В СУНДУКЕ: КЛЮЧ!", 1.4); }
                else {
                    const slot = p.inventory.potions.findIndex(s => !s);
                    if (slot >= 0) { p.inventory.potions[slot] = "potion"; sfx.good(); showMessage("В СУНДУКЕ: АПТЕЧКА!", 1.4); }
                    else showMessage("АПТЕЧКА НАЙДЕНА, НО СЛОТЫ ПОЛНЫ", 1.4);
                }
            } else { showMessage("СУНДУК ПУСТ", 1.0); }
            spawnBurst(ch.x, ch.y, "#ffcf3f", 14);
        }
        for (const mc of m.machines) if (Math.hypot(p.ax-mc.x, p.ay-mc.y) < 45) { openMachineMenu(mc.tierKey); I.interact = false; }
        if (Math.hypot(p.ax-m.exit.x, p.ay-m.exit.y) < 50) {
            if (!m.exit.locked) { exitMaze(true); I.interact = false; }
            else if (p.inventory.keys > 0) { p.inventory.keys--; m.exit.locked = false; sfx.door(); showMessage("ЗАМОК ОТКРЫТ КЛЮЧОМ", 1.6); I.interact = false; }
            else { showMessage("ДВЕРЬ ЗАПЕРТА — НУЖЕН КЛЮЧ", 1.4); I.interact = false; }
        }
    }

    // tentacle monster: patrols, chases if close, periodically seals passages
    const mo = m.monster;
    const distToPlayer = Math.hypot(p.ax-mo.x, p.ay-mo.y);
    mo.state = distToPlayer < 260 ? "chase" : "patrol";
    mo.retargetTimer -= dt;
    if (mo.hitCd > 0) mo.hitCd -= dt;
    if (mo.state === "chase") {
        const d = distToPlayer || 1;
        mo.currentSpeed += (2.6 - mo.currentSpeed) * Math.min(1, dt*3);
        mo.x += (p.ax-mo.x)/d*mo.currentSpeed; mo.y += (p.ay-mo.y)/d*mo.currentSpeed;
        if (distToPlayer < 44 && (mo.hitCd || 0) <= 0) { damagePlayerHit(22); mo.hitCd = 1.0; screenShakeKick(0.8); }
        if (p.hp <= 0) { p.hp = p.maxHp * 0.6; exitMaze(false); showMessage("Тьма поглотила тебя... Ты очнулся у врат лабиринта.", 2.6); return; }
    } else if (mo.retargetTimer <= 0) {
        mo.currentSpeed *= 0.9;
        mo.retargetTimer = 2.0 + Math.random()*2;
        const cell = mazeCellAt(mo.x, mo.y);
        const wp = m.cellWorld(clamp(cell.r+Math.floor(Math.random()*3)-1,0,m.rows-1), clamp(cell.c+Math.floor(Math.random()*3)-1,0,m.cols-1));
        mo.targetX = wp.x; mo.targetY = wp.y;
    } else {
        const d = Math.hypot(mo.targetX-mo.x, mo.targetY-mo.y);
        if (d > 8) { mo.x += (mo.targetX-mo.x)/d*1.1; mo.y += (mo.targetY-mo.y)/d*1.1; }
    }
    mo.tentacleTimer -= dt;
    if (mo.tentacleTimer <= 0) {
        mo.tentacleTimer = 10 + Math.random()*5;
        m.sealedWalls = m.sealedWalls.filter(w => w.timer > 0);
        const nearWalls = m.walls.filter(w => Math.hypot(w.x-mo.x, w.y-mo.y) < 220);
        for (let i=0;i<Math.min(2,nearWalls.length);i++) {
            const w = nearWalls[Math.floor(Math.random()*nearWalls.length)];
            m.sealedWalls.push({ ...w, timer: 15.0 });
        }
        if (m.sealedWalls.length) showMessage("ЩУПАЛЬЦА ПЕРЕКРЫВАЮТ ПРОХОДЫ!", 1.6);
    }
    for (const w of m.sealedWalls) if (w.timer > 0) w.timer -= dt;
}

function drawTentacleMonster(sx, sy, t, alarmed){
    // dark grey/black creature with glowing violet eyes and writhing tentacles
    ctx.save(); ctx.translate(sx, sy);
    for (let i=0;i<5;i++) {
        const ang = i/5*Math.PI*2 + t*0.6;
        const len = 46 + Math.sin(t*3+i)*10;
        ctx.strokeStyle = "rgba(30,20,40,0.9)"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0,10);
        ctx.quadraticCurveTo(Math.cos(ang)*len*0.6, 10+Math.sin(ang)*len*0.6, Math.cos(ang)*len, 10+Math.sin(ang)*len);
        ctx.stroke();
    }
    const grad = ctx.createRadialGradient(0,-10,4,0,-10,44);
    grad.addColorStop(0,"#2a1c30"); grad.addColorStop(1,"#0c0810");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(0,-10,38,48,0,0,7); ctx.fill();
    const eyeCol = alarmed ? "#ff3fff" : "#8a3fff";
    ctx.fillStyle = eyeCol; ctx.globalAlpha = 0.85+0.15*Math.sin(t*8);
    ctx.beginPath(); ctx.ellipse(-12,-18,5,7,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12,-18,5,7,0,0,7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
}

function spawnBurst(x,y,color,n=16){
    for (let i=0;i<n;i++) G.particles.push({ x,y, vx:Math.random()*8-4, vy:Math.random()*8-4, life:0.35+Math.random()*0.35, color });

// ---------------- GACHA MACHINE MENU ----------------
function openMachineMenu(tierKey){
    G.machineMenu = { tierKey, stage:"idle", spinT:0, card:null };
}
function rollMachine(tierKey){
    const t = RARITY[tierKey], p = G.player;
    const stats = t.statBonus();
    p.dmg += stats.dmg; p.maxHp += stats.hp; if (t.healOnGain) p.hp += stats.hp;
    p.maxShield += stats.shield; p.shield += stats.shield;
    const card = { tier: tierKey, name: t.name, color: t.color,
        statText: `УРОН +${stats.dmg.toFixed(1)}  ХП +${stats.hp.toFixed(1)}  ЩИТ +${stats.shield.toFixed(1)}`,
        abilities: [] };
    // each ability's drop is independent of the others — one card can grant
    // more than one ability, or none, purely on its own odds
    for (const ab of t.abilities) {
        if (Math.random() < ab.chance) { ab.apply(p); card.abilities.push({ name: ab.name, desc: ab.desc }); }
    }
    return card;
}
function updateMachineMenu(dt){
    const m = G.machineMenu; if (!m) return;
    if (m.stage === "spin") {
        m.spinT += dt;
        if (Math.random() < 0.4) sfx.spin();
        if (m.spinT > 0.9) { m.stage = "result"; m.card = rollMachine(m.tierKey); sfx.good(); }
    }
}

function updateArena(dt){

    if (b.successFaceTimer > 0) b.successFaceTimer -= dt;
    if (b.hitFlash > 0) b.hitFlash -= dt;
    updateBossExtras(dt);
    updateBossTheme(dt);
    if (b.dodgeCd > 0) b.dodgeCd -= dt;

    const gasSlow = G.inGas ? 0.55 : 1;
    const mv = arenaMove(dt, gasSlow); let nextX = p.ax + mv.x, nextY = p.ay + mv.y;   // ice act: you slide
    if (!p.abilities.wallClip) {
        for (const obs of G.obstacles) {
            if (Math.abs(nextX-obs.x) < obs.w/2+12 && Math.abs(nextY-obs.y) < obs.h/2+12) { nextX = p.ax; nextY = p.ay; }
        }
    }
    p.ax = nextX; p.ay = nextY;

    const effR = ARENA_R - 40;   // gas no longer walls you in — it just hurts
    const distC = Math.hypot(p.ax, p.ay);
    if (distC > effR) { const ang = Math.atan2(p.ay,p.ax); p.ax = Math.cos(ang)*effR; p.ay = Math.sin(ang)*effR; }

    if (I.jumpPressed) { p.dodging = 12; I.jumpPressed = false; }
    if (p.dodging > 0) p.dodging--;

    firePlayerWeapon(dt, p, true);
    for (const l of G.lasers) {
        l.x += l.vx; l.y += l.vy;
        if (Math.hypot(l.x-l.startX, l.y-l.startY) > LASER_RANGE*ARENA_SCALE*0.4) l.dead = true;
        if (!p.abilities.wallClip) for (const obs of G.obstacles) if (Math.abs(l.x-obs.x)<obs.w/2 && Math.abs(l.y-obs.y)<obs.h/2) l.dead = true;
        if (!l.dead && b.alive && Math.hypot(l.x-b.x, l.y-b.y) < 70) { l.dead = true; hitBoss(p.dmg*(l.mult || 1)); b.hitFlash = 0.15; }
        for (const m of G.miniCopies) {
            if (!m.dead && !l.dead && Math.hypot(l.x-m.x, l.y-m.y) < 26) {
                l.dead = true; m.hp -= p.dmg*(l.mult || 1); spawnBurst(m.x,m.y,"#ff9696");
                m.hitFlash = 0.15; m.knockback = Math.sign(l.vx)*6 || 6;
                if (m.hp <= 0) { m.dead = true; gainOmp(8+Math.floor(Math.random()*6)); sfx.good(); }
            }
        }
    }
    G.lasers = G.lasers.filter(l => !l.dead);
    G.miniCopies = G.miniCopies.filter(m => !m.dead);

    for (const pr of G.enemyProj) {
        pr.x += pr.vx; pr.y += pr.vy; pr.life -= dt;
        if (!p.dodging && Math.hypot(pr.x-p.ax, pr.y-p.ay) < 26) { damagePlayerHit(pr.dmg); b.successFaceTimer = 1.0; pr.dead = true; }
        else if (pr.life<=0 || Math.hypot(pr.x,pr.y) > ARENA_R+80) pr.dead = true;
    }
    G.enemyProj = G.enemyProj.filter(pr => !pr.dead);

    if (b.stunTimer > 0) { b.stunTimer -= dt; b.hopY = 0; }
    else if (b.alive) {
        b.attackTimer -= dt; if (b.attackTimer <= 0) startBossAttack();
        b.moveTimer -= dt;
        if (b.moveTimer <= 0) { b.targetX = p.ax+(Math.random()*440-220); b.targetY = p.ay+(Math.random()*440-220); b.moveTimer = 1.0+Math.random()*1.5; }
        const bd = Math.hypot(b.targetX-b.x, b.targetY-b.y);
        if (bd > 20) { b.x += (b.targetX-b.x)/bd*(3.0+b.phaseIdx*0.35); b.y += (b.targetY-b.y)/bd*(3.0+b.phaseIdx*0.35); }

        if (b.currentAttack === "seismic" && b.seismicTelegraph > 0) {
            const progress = 1 - (b.seismicTelegraph/1.2);
            b.hopY = -Math.sin(progress*Math.PI) * 46;
            b.seismicTelegraph -= dt;
            if (b.seismicTelegraph <= 0) {
                b.hopY = 0; G.screenShake = 2.0;
                const dist = Math.hypot(p.ax-b.x, p.ay-b.y);
                const hidden = G.obstacles.some(o => Math.hypot(o.x-p.ax, o.y-p.ay) < 50);
                if (dist < ARENA_R*0.4 && !hidden && !p.dodging) { damagePlayerHit(22.0); b.successFaceTimer = 1.0; }
                b.currentAttack = null;
            }
        } else b.hopY *= 0.8;

        if (G.gasActive) {
            G.gasTimer -= dt;
            if (G.gasTimer <= 0) { G.gasActive = false; if (b.currentAttack==="gas") b.currentAttack = null; }
        }
        if (G.arenaDarkness > 0 && b.currentAttack !== "darkness") G.arenaDarkness -= dt*0.25;
        b.dodgeBonus = (b.currentAttack==="darkness" || G.arenaDarkness>0.3) ? 0.15 : 0;
    }

    for (const m of G.miniCopies) {
        if (m.hitFlash > 0) m.hitFlash -= dt;
        if (m.knockback) m.knockback *= 0.85;
        const dist = Math.hypot(p.ax-m.x, p.ay-m.y);
        const baseSpeed = 1.8, mspeed = m.kind==="mini_ballerina" ? baseSpeed*1.5 : baseSpeed;
        if (dist > 10) { m.x += (p.ax-m.x)/dist*mspeed; m.y += (p.ay-m.y)/dist*mspeed; }
        if (m.kind === "mini_clown") {
            m.noseCd -= dt;
            if (m.noseCd <= 0 && dist < 420) { const ang = Math.atan2(p.ay-m.y, p.ax-m.x); G.enemyProj.push({ x:m.x, y:m.y, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, dmg:3.0, life:2.5, kind:"nose", dead:false }); m.noseCd = 5.0; }
        } else if (m.kind === "mini_dancer") {
            m.healCd -= dt;
            if (m.healCd <= 0) { m.hp = Math.min(m.maxHp, m.hp+5); for (const o of G.miniCopies) if (o!==m) o.hp = Math.min(o.maxHp, o.hp+2); if (b.alive) b.hp = Math.min(b.maxHp, b.hp+2); spawnBurst(m.x,m.y,"#3eff9e"); sfx.heal(); m.healCd = 60.0; }
        } else if (dist < 32 && m.cd <= 0) { damagePlayerHit(6.0); sfx.robotAtk(); m.cd = 1.4; b.successFaceTimer = 1.0; }
        if (m.cd > 0) m.cd -= dt;
    }

    for (const s of G.shadows) {
        if (b.alive) {
            const d = Math.hypot(b.x-s.x, b.y-s.y);
            if (d > 12) { s.x += (b.x-s.x)/d*3.2; s.y += (b.y-s.y)/d*3.2; }
            else if (s.atkCd <= 0) { hitBoss(s.dmg); s.atkCd = 0.8; }
        }
        if (s.atkCd > 0) s.atkCd -= dt;
    }

    if (p.hp <= 0) { p.hp = p.maxHp*0.5; p.shield = p.maxShield; p.ax = 0; p.ay = 220; showMessage("КРИТИЧЕСКИЙ СБОЙ. ВОССТАНОВЛЕНИЕ СИСТЕМ.", 1.5); }

    if (b.hp <= 0 && b.alive) startBossEnding();   // seven acts, no second wind — then the ending
    if (!b.alive) {
        for (const port of G.portals) {
            port.spin += dt*2;
            if (I.interact && Math.hypot(p.ax-port.x, p.ay-port.y) < 70) {
                G.state = "END"; G.endAlpha = 0;
                const worlds = ["КОСМОСА","ОКЕАНА","ПУСТЫНИ"];
                G.endText = `ВЫ ВОШЛИ В ПОРТАЛ ${worlds[port.id]}!\nКОНЕЦ ИГРЫ. Продолжение следует...\nСпасибо за игру!`;
            }
        }
        I.interact = false;
    }
}

function activateImmortal(){
    const p = G.player;
    if (p.abilities.immortalUnlocked && p.abilities.immortalCd <= 0) {
        p.immortal = true; p.immortalTimer = 5.0; p.abilities.immortalCd = 90.0;
    }
}

function handleClick(mx, my){
    if (adminClick(mx, my)) return;
    if (notebookClick(mx, my)) return;
    if (G.talk) { talkClick(mx, my); return; }
    if (G.dialog) { dialogClick(mx, my); return; }
    if (G.machineMenu) { handleMachineMenuClick(mx,my); return; }
    if (backButtonRect && (G.state==="LORE"||G.state==="SETTINGS")) {
        const r = backButtonRect;
        if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { G.state="MENU"; backButtonRect=null; return; }
    }
    if (pauseButtonRect && (G.state==="PATH"||G.state==="ARENA"||G.state==="ISLAND"||G.state==="MAZE"||G.state==="PUZZLE"||G.state==="CLOSEUP"||G.state==="MINEROOM")) {
        const r = pauseButtonRect;
        if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { G.state="MENU"; G.roomIsland=null; G.maze=null; G.puzzle=null; G.machineMenu=null; return; }
    }
    const inPlay = (G.state==="PATH"||G.state==="ARENA"||G.state==="ISLAND"||G.state==="MAZE"||G.state==="PUZZLE"||G.state==="CLOSEUP"||G.state==="MINEROOM");
    if (inPlay) {
        for (let i=0;i<potionSlotRects.length;i++) {
            const r = potionSlotRects[i];
            if (G.player.inventory.potions[i] && mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                G.player.inventory.potions[i] = null;
                G.player.hp = Math.min(G.player.maxHp, G.player.hp + G.player.maxHp*0.4);
                sfx.heal(); showMessage("АПТЕЧКА ИСПОЛЬЗОВАНА", 1.2);
                return;
            }
        }
    }
    if (inPlay && immortalBtnRect) {
        const r = immortalBtnRect;
        if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { activateImmortal(); return; }
    }
    if (inPlay && shadowBtnRect) {
        const r = shadowBtnRect;
        if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { summonShadow(); return; }
    }
    if (G.state === "CLOSEUP") { const r = CP_EXIT_BTN; if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) closeCloseup(false); return; }
    if (G.state === "MINEROOM") { const r = MINE_EXIT_BTN; if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) leaveMineRoom(false); return; }
    if (G.state === "PUZZLE") {
        const r = PUZZLE_EXIT_BTN;
        if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) exitPuzzle();
        return;
    }
    if (G.state === "ISLAND") {
        const exitR = { x:30, y:HEIGHT-70, w:170, h:48 };
        if (mx>=exitR.x&&mx<=exitR.x+exitR.w&&my>=exitR.y&&my<=exitR.y+exitR.h) { exitIslandRoom(); return; }
        return;
    }
    if (G.state === "MENU") {
        if (G.diffPick) { diffClick(mx, my); return; }
        for (const target in menuButtons) {
            const b = menuButtons[target];
            if (mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h) {
                if (target === "PATH") { G.diffPick = true; }
                else G.state = target;
                return;
            }
        }
    } else if (G.state === "SETTINGS") {
        for (const key in sliderRects) {
            const r = sliderRects[key];
            if (mx>=r.x-10&&mx<=r.x+r.w+10&&my>=r.y-14&&my<=r.y+14) { draggingSlider=key; VOL[key]=clamp((mx-r.x)/r.w,0,1); return; }
        }
    }
}

    const mx = (e.clientX-rect.left)/scale, r = sliderRects[draggingSlider];

}

const TAU = Math.PI * 2;
function lerp(a, b, t){ return a + (b - a) * t; }
function hash(n){ const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
function depthScale(d){ return 1 + d * 0.004; }
function inGarden(x){ return x >= GARDEN_START && x <= GARDEN_END; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function chime(notes, step = 0.11, vol = 0.16, wave = 'triangle'){
    notes.forEach((n, i) => setTimeout(() => playTone(n, 0.3, vol * VOL.music + 0.02, wave), i * step * 1000));
}
const KIND_NAMES = { skeleton:"Скелет", barman:"Бармен", dancer:"Танцор", clown:"Клоун", ballerina:"Балерина" };
const DOLL_KINDS = ["skeleton", "barman", "dancer", "clown", "ballerina"];

function makeRobot(x, kind, lane){
    const d = KIND_DEF[kind];
    return { x, y: LANE_Y, w: 46, h: 62, vx: 0, vy: 0, hopY: 0, kind, lane: lane || 0,
        hp: d.hp * 2, maxHp: d.hp * 2, dead: false, fade: 0, attackCd: rnd(0.4, 1.4), atkSfxCd: 0,
        stepCd: Math.random(), jumpCd: Math.random() * 2, grounded: true,
        hitFlash: 0, knockback: 0, faceDir: -1, attacking: false, attackAnim: 0, throwAnim: 0, windup: 0,
        landSquash: 0, walkPhase: Math.random() * 6, buffing: false, seed: Math.random() * 10 };
}

function canSpawnDollAt(x){
    if (x < 300) return false;                                            // never inside the arcade hall
    if (x > BEAR_TRIGGER_X - 300 && x < GARDEN_END + 150) return false;   // chase + gardens are doll-free
    if (!G.mineOpen && x > MINE_HOUSE_X - 150 && x < MAZE_ENTRANCE_X) return false;   // nothing behind the shut mine
    if (!G.mazeDone && x > MAZE_ENTRANCE_X - 120) return false;           // nothing spawns behind the sealed gate
    return x < WORLD_LENGTH - 200;
}

function generatePath(){
    G.robots = []; G.islands = []; G.lasers = []; G.enemyProj = []; G.acidPool = []; G.particles = [];
    G.battleActive = false; G.waveTriggered = false; G.decor = []; G.shadows = [];
    G.bear = null; G.bearChaseDone = false; G.spawnTimer = 15; G.mazeDone = true; G.maze = null; G.mineOpen = false; /* maze disabled for now (code kept) */ G.mine = null; G.mineEnter = -1; G.mineDoorOpenAt = null; G.sporeClouds = []; G.player.hypno = 0;
    G.sectionIdx = -1; G.banner = null; G.checkpointX = WORLD_START + 60; G.puzzle = null; G.lastKilledKind = null;

    let x = BATTLE_START + 500;
    while (x < WORLD_LENGTH - 400) {
        if (canSpawnDollAt(x) || (x > MINE_DOOR_X + 300 && x < MAZE_ENTRANCE_X - 300) || (x > MAZE_ENTRANCE_X + 200 && x < WORLD_LENGTH - 400))
            G.robots.push(makeRobot(x, pickDollKind(x), Math.random() < 0.4 ? 1 : 0));
        x += 260 + Math.random() * 220;
    }

    const casinoXs = [1800, 5600, 9200, 12400, GARDEN_END + 1200, MINE_END + 1500, MAZE_ENTRANCE_X + 2500, MAZE_ENTRANCE_X + 5800];
    for (const ix of casinoXs) {
        const tierKeys = ["rare", "epic", "ultraEpic"];
        if (Math.random() < RARITY.ultraLegendary.spawnChance) tierKeys.push("ultraLegendary");
        G.islands.push({ x: ix, y: 0, rx: 120, domeOn: true, machines: tierKeys });
    }

    // road decor — every item has its own depth on the deck
    for (let dx = WORLD_START + 40; dx < WORLD_LENGTH; dx += 120) {
        if (dx > GARDEN_START - 120 && dx < GARDEN_END + 120) continue;   // gardens have their own scenery
        if (dx < 0) continue;                                              // arcade hall is kept clean
        const roll = Math.random(), d = rnd(DECK_BACK + 4, -4);
        if (roll < 0.10) G.decor.push({ type: "darkPlank", x: dx });
        else if (roll < 0.19) G.decor.push({ type: "box", x: dx, d, seed: Math.random() });
        else if (roll < 0.27) G.decor.push({ type: "puddle", x: dx, d, seed: Math.random() });
        else if (roll < 0.33) G.decor.push({ type: "nose", x: dx, d, seed: Math.random() });
        else if (roll < 0.38) G.decor.push({ type: "trash", x: dx, d, seed: Math.random() });
    }

    generateChaseObstacles();
    generateRoadObstacles();

    generateGarden();
    generateGardenBeasts();
    G.gardenEntered = false; G.cut = null; G.sub = null; G.subEnter = null; G.locNow = null; G.leftGarden = false; G.inMine = false; G.leftMine = false; G.dialog = null; G.ending = null; G.actBanner = null;
    generateMineRooms();
    const p = G.player;
    p.x = WORLD_START + 60; p.y = LANE_Y; p.hopY = 0; p.vy = 0; p.omp = 0; p.hp = p.maxHp;
}

function updateSections(){
    const p = G.player;
    let idx = 0;
    for (let i = 0; i < SECTIONS.length; i++) if (p.x >= SECTIONS[i].x) idx = i;
    if (idx > G.sectionIdx) {
        const first = G.sectionIdx < 0;
        G.sectionIdx = idx;
        const s = SECTIONS[idx];
        G.banner = { name: s.name, sub: s.sub, t: 0 };
        const cp = s.x === BEAR_TRIGGER_X ? s.x - 260 : (idx === 0 ? WORLD_START + 60 : s.x + 40);
        if (cp > G.checkpointX) { G.checkpointX = cp; if (!first) setTimeout(() => showMessage("ЧЕКПОИНТ СОХРАНЁН", 1.4), 1800); }
        chime(s.x === BEAR_TRIGGER_X ? [330, 311, 294, 277] : [523, 659, 784]);
    }
}

function respawnAtCheckpoint(){
    const p = G.player;
    p.hp = p.maxHp; p.shield = p.maxShield; p.x = G.checkpointX; p.lane = 0; p.laneOff = 0; p.y = LANE_Y; p.hopY = 0; p.vy = 0; p.poisonTimer = 0;
    G.bear = null;                                   // dying mid-chase restarts the chase from its checkpoint
    resetChaseObstacles();
    G.enemyProj = []; G.acidPool = []; G.shadows = []; G.sporeClouds = []; p.hypno = 0;
    G.robots = G.robots.filter(r => Math.abs(r.x - p.x) > 650);   // the dolls that got you are gone
    showMessage("СИСТЕМЫ ПЕРЕЗАГРУЖЕНЫ — ВОЗВРАТ К ЧЕКПОИНТУ", 2.2);
    sfx.portal();
}


function updateParticles(dt){
    for (const pt of G.particles) {
        pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.93; pt.vy = pt.vy * 0.93 + (pt.g || 0); pt.life -= dt;
    }
    G.particles = G.particles.filter(pt => pt.life > 0);
    if (G.particles.length > 700) G.particles.splice(0, G.particles.length - 700);
}

function updatePathBase(dt){
    const p = G.player;
    if (G.machineMenu) return;
    if (updateCutscene(dt)) return;
    if (updateSubEnter(dt)) return;
    if (updateMineEnter(dt)) return;
    updateSections();

    if (p.x >= BATTLE_START && !G.battleActive) G.battleActive = true;
    if (p.x >= WAVE_TRIGGER_X && !G.waveTriggered) {
        G.waveTriggered = true;
        for (let i = 0; i < 18; i++) G.robots.push(makeRobot(p.x + 420 + i * 70, DOLL_KINDS[Math.floor(Math.random() * 5)], Math.random() < 0.5 ? 1 : 0));
        showMessage("ОГРОМНАЯ ВОЛНА ТЕАТРАЛЬНЫХ КУКОЛ!", 2.5);
    }

    // dolls keep arriving every 15 seconds — from ahead and sometimes from behind
    if (G.battleActive && !G.bear) {
        G.spawnTimer -= dt;
        if (G.spawnTimer <= 0) {
            G.spawnTimer = 15.0;
            const n = 2 + Math.floor(Math.random() * 3), behind = Math.random() < 0.3;
            for (let i = 0; i < n; i++) {
                const sx = behind ? p.x - 560 - i * 80 : p.x + 540 + i * 80;
                if (canSpawnDollAt(sx)) G.robots.push(makeRobot(sx, pickDollKind(sx), Math.random() < 0.5 ? 1 : 0));
            }
        }
    }

    // ---- bear chase ----
    if (p.x >= BEAR_TRIGGER_X && !G.bear && !G.bearChaseDone) {
        G.bear = { x: p.x - 420, y: 0, falling: true, fallY: -480, speed: p.speed * 1.6 * 1.1, /* 10% faster than your normal run */ currentSpeed: 0, roarCd: 1.5 };
        showMessage("ЧТО-ТО ОГРОМНОЕ ПАДАЕТ С НЕБА...", 2.0);
    }
    let adrenaline = 1;
    if (G.bear) {
        const b = G.bear;
        if (b.falling) {
            b.fallY += (0 - b.fallY) * Math.min(1, dt * 2.4);
            if (b.fallY > -4) {
                b.fallY = 0; b.falling = false; screenShakeKick(2.2);
                for (let i = 0; i < 30; i++) G.particles.push({ x: b.x + rnd(-120, 140), y: -4, vx: rnd(-4, 4), vy: rnd(-5, -1), life: 0.9, max: 0.9, color: i % 2 ? "#d8d8e0" : "#8a6a3a", g: 0.25 });
                bearRoar(true);
                showMessage("БЕЛЫЙ МЕДВЕДЬ! БЕГИ К САДАМ!", 2.0);
            }
        } else {
            adrenaline = 1.2;     // adrenaline: running clean you slowly pull away; every stumble lets him gain   // adrenaline: a hero who keeps running outpaces the bear
            const gapNow = p.x - b.x;
            if (gapNow > 650 && !(b.pounce > 0) && !(b.leap > 0)) { b.pounce = 0.8; playTone(70, 0.8, 0.45 * VOL.boss, 'sawtooth', 35); }   // only a catch-up leap when far behind
            if (b.pounce > 0) { b.pounce -= dt; if (b.pounce <= 0) { b.leap = 0.55; b.leapTarget = p.x - 260; } }
            if (b.leap > 0) { b.leap -= dt; b.x = Math.min(b.x + b.speed * 2.6, b.leapTarget); b.currentSpeed = b.speed; }   // never lands ahead of you
            else b.currentSpeed += (b.speed - b.currentSpeed) * Math.min(1, dt * 1.8);
            b.x = Math.min(b.x + b.currentSpeed, p.x - 30);   // he can't run past you — he mauls you
            b.walk = (b.walk || 0) + b.currentSpeed * 0.055;
            if (Math.random() < 0.5) G.particles.push({ x: b.x - 70 + rnd(-30, 30), y: -2, vx: rnd(-2.5, -0.5), vy: rnd(-1.6, -0.2), life: 0.7, max: 0.7, color: "#b9b4a8" });
            for (const ob of G.chaseObstacles) if (!ob.smashed && ob.type !== "hole" && b.x + 130 > ob.x) {
                ob.smashed = true; screenShakeKick(0.7);
                for (let i = 0; i < 16; i++) G.particles.push({ x: ob.x + rnd(-20, 20), y: -14, vx: rnd(-1, 6), vy: rnd(-6, -1), life: 0.8, max: 0.8, color: i % 2 ? "#8a6a3a" : "#5a3e22", g: 0.3 });
            }
            const gap = p.x - b.x;
            if (gap < 150) { damagePlayerTick(40 * dt); if (Math.random() < 0.05) screenShakeKick(0.5); }
            b.roarCd -= dt;
            if (b.roarCd <= 0) { b.roarCd = 2.8 + Math.random() * 2; bearRoar(false); }
            if (p.x >= GARDEN_START && G.gardenEntered && !G.cut) {
                G.bear = null; G.bearChaseDone = true; screenShakeKick(1.2);
                showMessage("Врата садов захлопнулись. Медведь остался снаружи.", 2.8);
            }
        }
    }

    // ---- movement: x along the road, y = depth across the 2.5D deck ----
    const prevX = p.x;
    p.x += I.x * p.speed * 1.6 * adrenaline * (p.inPuddle ? 0.45 : 1) * (p.inSpore ? 0.6 : 1) * (p.hypno > 0 ? 0.2 : 1) * (G.admin && G.admin.fast ? 2 : 1);
    p.y = LANE_Y;   // 2D: one lane
    if (!G.mazeDone && p.x > MAZE_ENTRANCE_X + 30) {
        p.x = MAZE_ENTRANCE_X + 30;
        if (G.messageTimer <= 0) showMessage("Путь перекрыт решёткой. Вперёд — только через лабиринт (E у врат)", 1.8);
    }
    updateChaseObstacles(dt, prevX);
    updateJunctions(dt, prevX);
    updateDoorGates(prevX);
    updateMineGate(prevX);
    updateWorldTick(dt, prevX);
    worldBounds(prevX);
    nbKillScan(); dollAmbience(dt);
    p.x = clamp(p.x, WORLD_START + 20, WORLD_LENGTH - 20);
    G.camX = clamp(p.x - WIDTH * 0.35, WORLD_START - 40, WORLD_LENGTH - WIDTH);

    if (I.jumpPressed) { if (p.jumpsLeft > 0) { p.vy = -9.5; p.onGround = false; p.jumpsLeft--; } I.jumpPressed = false; }
    p.vy += 0.5; p.hopY += p.vy;
    if (p.hopY >= 0) {
        if (!p.onGround) {
            for (let i = 0; i < 7; i++) G.particles.push({ x: p.x + rnd(-14, 14), y: p.y - 2, vx: rnd(-1.6, 1.6), vy: rnd(-1.4, -0.2), life: 0.45, max: 0.45, color: "#b4a58a" });
            p.landSquash = 1.0;
        }
        p.hopY = 0; p.vy = 0; p.onGround = true; p.jumpsLeft = 1;
    }

    // ---- doors ----
    if (I.interact && G.doorCooldown <= 0 && tryInteractHooks()) I.interact = false;
    if (I.interact) {
        if (G.doorCooldown <= 0) {
            const door = G.islands.find(isl => Math.abs(p.x - isl.x) < 55);
            const pz = G.puzzleDoors.find(d => Math.abs(p.x - d.x) < 55);
            if (door) { G.state = "ISLAND"; G.roomIsland = door; G.doorCooldown = 0.6; p.ax = 0; p.ay = 0; sfx.door(); }
            else if (pz && !pz.unlocked) openPuzzle(pz);
            else if (!G.mineOpen && Math.abs(p.x - MINE_HOUSE_X) < 70) { G.mineEnter = 0; playTone(180, 0.4, 0.2 * VOL.robot, 'sine', 120); }
            else if (!G.mazeDone && Math.abs(p.x - MAZE_ENTRANCE_X) < 80) { generateMaze(); G.state = "MAZE"; G.doorCooldown = 0.6; sfx.door(); }
        }
        I.interact = false;
    }
    if (G.doorCooldown > 0) G.doorCooldown -= dt;
    if (G.screenShake > 0) G.screenShake -= dt * 4;

    // ---- weapons ----
    firePlayerWeapon(dt, p, false);
    for (const l of G.lasers) {
        l.x += l.vx; l.y += l.vy; l.h += l.vh || 0;
        if (l.up ? l.h < -620 : Math.hypot(l.x - l.startX, l.y - l.startY) > LASER_RANGE) l.dead = true;
    }

    // ---- barman bottles (x along road, d = depth, y = height) ----
    for (const pr of G.enemyProj) {
        if (!isFinite(pr.d)) pr.d = LANE_Y; if (!isFinite(pr.y) || pr.y < -2000) pr.y = -50;   // never let a stray projectile poison the road
        pr.x += pr.vx; pr.d += pr.vd || 0; pr.y += pr.vy; pr.vy += 0.25; pr.life -= dt; pr.spin = (pr.spin || 0) + 0.32;
        if (pr.y >= 0 || pr.life <= 0) {
            pr.dead = true;
            G.acidPool.push({ x: pr.x, d: pr.d, r: 36, life: 6.0 });
            for (let i = 0; i < 10; i++) G.particles.push({ x: pr.x, y: pr.d - 4, vx: rnd(-2.5, 2.5), vy: rnd(-3, -0.5), life: 0.5, max: 0.5, color: i % 3 ? "#5af07a" : "#d8ffe0", g: 0.2 });
            playTone(jit(1500), 0.07, 0.12 * VOL.robot, 'square', 700);
        }
    }
    G.enemyProj = G.enemyProj.filter(pr => !pr.dead);
    p.inPuddle = false;
    for (const pool of G.acidPool) {
        pool.life -= dt;
        if (Math.abs(p.x - pool.x) < pool.r && Math.abs(p.y - pool.d) < 18 && p.hopY > -10) { damagePlayerTick(9.0 * dt); p.poisonTimer = 3.0; p.inPuddle = true; }
    }
    G.acidPool = G.acidPool.filter(a => a.life > 0);
    if (p.poisonTimer > 0) { damagePlayerTick(0.5 * dt); p.poisonTimer -= dt; }

    if (G.battleActive) updatePathRobots(dt);
    p.inSpore = false;
    if (!(p.x > GARDEN_START - 900 && p.x < GARDEN_END + 900)) p.hypno = 0;
    if (p.x > GARDEN_START - 900 && p.x < GARDEN_END + 900) { updateGarden(dt); updateGardenBeasts(dt); updateGardenRooms(); }
    G.lasers = G.lasers.filter(l => !l.dead);

    for (const r of G.robots) if (r.dead) r.fade++;
    G.robots = G.robots.filter(r => !(r.dead && r.fade > 24));

    if (p.hp <= 0) respawnAtCheckpoint();
    if (p.x > WORLD_LENGTH - 120) { G.state = "ARENA"; generateArena(); showMessage("ГРАНДИОЗНЫЙ КИБЕР-АНГАР: АРЕНА DQOPD", 2.5); }
}


function killDoll(r, color){
    r.dead = true; r.fade = 0; G.lastKilledKind = r.kind;
    gainOmp(15 + Math.floor(Math.random() * 10));
    const kd = KIND_DEF[r.kind]; if (kd.rareBonus && Math.random() < 0.2) gainOmp(kd.rareBonus);
    for (let i = 0; i < 18; i++) G.particles.push({ x: r.x, y: r.y - 30, vx: rnd(-4, 4), vy: rnd(-5, 1), life: 0.7, max: 0.7, color: i % 3 ? (color || "#9696a0") : "#ffcf3f", g: 0.18 });
}

function updatePathRobots(dt){
    const p = G.player;
    const awake = [];
    for (const r of G.robots) {
        if (r.hitFlash > 0) r.hitFlash -= dt;
        if (r.knockback) r.knockback *= 0.85;
        if (r.attackAnim > 0) r.attackAnim = Math.max(0, r.attackAnim - dt * 3.5);
        if (r.throwAnim > 0) r.throwAnim = Math.max(0, r.throwAnim - dt * 2.2);
        if (r.landSquash > 0) r.landSquash = Math.max(0, r.landSquash - dt * 5);
        if (r.dead) continue;
        const dist = p.x - r.x;
        if (Math.abs(dist) > 1300) continue;     // far-off dolls sleep — keeps a 52k road fast
        awake.push(r);
        const d = KIND_DEF[r.kind];
        const withinDome = G.islands.find(isl => Math.abs(r.x - isl.x) < isl.rx + 10 && isl.domeOn);
        if (withinDome) { r.x += (r.x < withinDome.x) ? -4 : 4; r.vx = 0; continue; }

        let auraSpeed = 1, auraDmg = 1; r.buffing = false;
        for (const o of G.robots) {
            if (o === r || o.dead || Math.abs(o.x - r.x) > 300) continue;
            if (o.kind === "dancer") auraSpeed = KIND_DEF.dancer.auraSpeed;
            if (o.kind === "clown") auraDmg = KIND_DEF.clown.auraDmg;
            if (r.kind === "dancer" || r.kind === "clown") r.buffing = true;
        }
        const speed = d.speed * auraSpeed;
        r.faceDir = dist >= 0 ? 1 : -1;
        // 2.5D: dolls step across the deck to line up with the hero's depth

        if (d.ranged) {
            let targetVx = 0;
            const inThrow = Math.abs(dist) > 200 && Math.abs(dist) < 520;
            if (inThrow) {
                r.attackCd -= dt;
                if (r.attackCd <= 0) {
                    { const sx0 = r.x + r.faceDir * 14, tx = p.x + rnd(-20, 60) * Math.sign(dist || 1); G.enemyProj.push({ x: sx0, d: r.y, y: -50, vx: (tx - sx0) / 62, vd: 0, vy: -7, life: 3.0, dead: false, spin: 0 }); }   // lands right at your feet: jump the puddle
                    r.attackCd = 1.8; r.throwAnim = 1;
                }
            } else if (Math.abs(dist) <= 200) targetVx = -Math.sign(dist || 1) * speed;   // backs away to keep range
            else targetVx = Math.sign(dist || 1) * speed;
            r.windup = inThrow && r.attackCd < 0.5 ? 1 - r.attackCd / 0.5 : 0;
            r.vx += (targetVx - r.vx) * Math.min(1, dt * d.accel);
        } else if (d.jump) {
            r.jumpCd -= dt;
            if (r.grounded && r.jumpCd <= 0 && Math.abs(dist) < 420) { r.vy = -10; r.grounded = false; r.jumpCd = 1.4 + Math.random(); }
            if (!r.grounded) { r.vy += 0.4; r.hopY += r.vy; if (r.hopY >= 0) { r.hopY = 0; r.vy = 0; r.grounded = true; r.landSquash = 1; } }
            const targetVx = Math.abs(dist) < 18 ? 0 : Math.sign(dist || 1) * speed;
            r.vx += (targetVx - r.vx) * Math.min(1, dt * d.accel);
        } else {
            if (Math.abs(dist) < 460) {
                const targetVx = Math.abs(dist) < d.meleeRange * 0.7 ? 0 : Math.sign(dist || 1) * speed;   // stop at striking distance
                r.vx += (targetVx - r.vx) * Math.min(1, dt * d.accel);
                r.stepCd -= dt; if (r.stepCd <= 0 && Math.abs(r.vx) > 0.3) { sfx.step(); r.stepCd = 0.42; }
            } else r.vx *= Math.max(0, 1 - dt * d.accel * 0.6);
        }
        r.x += r.vx;
        r.walkPhase += Math.abs(r.vx) * 0.13;
        // dolls may not enter the gardens, nor slip through the sealed maze gate
        if (inGarden(r.x)) r.x = (r.x - GARDEN_START < GARDEN_END - r.x) ? GARDEN_START - 12 : GARDEN_END + 12;
        if (!G.mazeDone && r.x > MAZE_ENTRANCE_X && r.x < MAZE_ENTRANCE_X + 60) r.x = MAZE_ENTRANCE_X + 60;
        if (!G.mineOpen && r.x > MINE_DOOR_X && r.x < MINE_DOOR_X + 60) r.x = MINE_DOOR_X + 60;

        const inRange = Math.abs(dist) < d.meleeRange && Math.abs(p.y - r.y) < 20 && p.hopY > -40 && r.hopY > -30;
        r.attacking = inRange && d.dps > 0;
        if (d.dps > 0 && inRange) {
            damagePlayerTick(d.dps * auraDmg * dt);
            r.atkSfxCd -= dt; if (r.atkSfxCd <= 0) { sfx.robotAtk(); r.atkSfxCd = 0.3; }
        } else if (d.hitDmg > 0) {
            r.attackCd -= dt;
            if (inRange && r.attackCd <= 0) {
                damagePlayerHit(d.hitDmg * auraDmg); sfx.robotAtk(); r.attackAnim = 1;
                r.attackCd = Math.random() < 0.25 ? d.hitCd * 0.4 : d.hitCd;
            }
        }
    }

    // bodies push each other apart — in x and across the deck, so crowds fan out
    for (let i = 0; i < awake.length; i++) for (let j = i + 1; j < awake.length; j++) {
        const a = awake[i], b = awake[j];
        if (Math.abs(a.y - b.y) > 14) continue;
        const dx = b.x - a.x, minD = 30;
        if (Math.abs(dx) < minD) {
            const sgn = dx === 0 ? (j % 2 ? 1 : -1) : Math.sign(dx), push = (minD - Math.abs(dx)) * 0.5;
            const wa = KIND_DEF[a.kind].weight || 1, wb = KIND_DEF[b.kind].weight || 1;
            a.x -= sgn * push * (wb / (wa + wb)); b.x += sgn * push * (wa / (wa + wb));
        }
    }

    // lasers vs dolls — must match the doll's depth lane AND body height (a jumping clown can hop over a shot)
    for (const l of G.lasers) {
        if (l.dead) continue;
        for (const r of awake) {
            if (r.dead) continue;
            if (Math.abs(l.x - r.x) < 24 && Math.abs(l.y - r.y) < 18 && l.h > r.hopY - 66 && l.h < r.hopY + 2) {
                r.hp -= p.dmg * (l.mult || 1); l.dead = true;
                r.hitFlash = 0.15; r.knockback = (Math.sign(l.vx) * 8 || 8) / (KIND_DEF[r.kind].weight || 1);
                if (r.hp <= 0) killDoll(r);
                break;
            }
        }
    }

    // "Самая Яркая Звезда" shadows: hunt the nearest doll, teleport back if left behind, can be worn down
    for (const s of G.shadows) {
        let target = null, best = 420;
        for (const r of awake) if (!r.dead) { const dd = Math.abs(r.x - s.x) + Math.abs(r.y - s.y); if (dd < best) { best = dd; target = r; } }
        const tx = target ? target.x - Math.sign(target.x - s.x) * 22 : p.x - 60, ty = target ? target.y : p.y;
        s.vx = (s.vx || 0) + (clamp(tx - s.x, -3.4, 3.4) - (s.vx || 0)) * Math.min(1, dt * 5);
        s.x += s.vx; s.y = clamp(s.y + clamp(ty - s.y, -1.2, 1.2), DECK_BACK, DECK_FRONT);
        s.walkPhase = (s.walkPhase || 0) + Math.abs(s.vx) * 0.13;
        s.faceDir = target ? Math.sign(target.x - s.x) || 1 : (s.vx >= 0 ? 1 : -1);
        if (Math.abs(p.x - s.x) > 900) { s.x = p.x - 60; s.y = p.y; }
        if (s.attackAnim > 0) s.attackAnim -= dt * 3;
        if (s.atkCd > 0) s.atkCd -= dt;
        if (target && Math.abs(target.x - s.x) < 36 && Math.abs(target.y - s.y) < 20) {
            s.hp -= (KIND_DEF[target.kind].dps + 2) * dt * 0.5;
            if (s.atkCd <= 0) {
                target.hp -= s.dmg; target.hitFlash = 0.15; s.atkCd = 0.6; s.attackAnim = 1;
                if (target.hp <= 0) killDoll(target, "#6a8cff");
            }
        }
    }
    G.shadows = G.shadows.filter(s => s.hp > 0);
}

function summonShadow(){
    const p = G.player;
    if (p.abilities.shadowUnlocked && p.abilities.shadowCd <= 0) {
        const isArena = G.state === "ARENA";
        const kind = G.lastKilledKind || "skeleton";
        const hp = Math.round(KIND_DEF[kind].hp / 2);
        G.shadows.push({ x: isArena ? p.ax + 50 : p.x - 50, y: isArena ? p.ay : p.y, hp, maxHp: hp, dmg: p.dmg * 0.5,
            atkCd: 0, kind, vx: 0, attackAnim: 0, faceDir: 1, walkPhase: 0 });
        p.abilities.shadowCd = 60.0; p.maskTimer = 1.6;
        chime([784, 988, 1175, 1568], 0.08, 0.2, 'sine');
        showMessage(`САМАЯ ЯРКАЯ ЗВЕЗДА: тень «${KIND_NAMES[kind]}» сражается за тебя`, 2.2);
    }
}

function exitMaze(completed){
    G.state = "PATH"; G.maze = null; G.doorCooldown = 0.6;
    const p = G.player; p.y = LANE_Y; p.hopY = 0;
    if (completed) { G.mazeDone = true; p.x = MAZE_ENTRANCE_X + 90; showMessage("Лабиринт пройден. Решётка поднята — дальше только театр.", 2.8); chime([523, 659, 784, 1046]); }
    else { p.x = MAZE_ENTRANCE_X - 90; showMessage("Ты отступил из лабиринта. Решётка всё ещё опущена.", 2.4); }
}



function gameLoop(now){
    let dt = (now - lastTime) / 1000.0; lastTime = now;
    if (dt > 0.05) dt = 0.05;
    G.t += dt;
    if (G.messageTimer > 0) G.messageTimer -= dt;

    try {
    pollInput();
    if (G.admin && G.admin.open) { I.x = 0; I.y = 0; I.fire = false; I.interact = false; I.jumpPressed = false; dt = 0; }
    updateMusic(dt);
    updateMobileControlsVisibility();
    const playing = ["PATH", "ISLAND", "ARENA", "MAZE", "PUZZLE", "CLOSEUP", "MINEROOM", "SUBROOM"].includes(G.state);
    if (playing) { updatePlayerTimers(dt); updateParticles(dt); }

    if (G.state === "MENU") drawMenu();
    else if (G.state === "LORE") drawLore();
    else if (G.state === "SETTINGS") drawSettings();
    else if (G.state === "PATH") { updatePath(dt); drawPathScreen(); drawHUD(); drawSectionBanner(dt); }
    else if (G.state === "PUZZLE") { updatePuzzle(dt); drawPuzzleScreen(); drawHUD(); }
    else if (G.state === "CLOSEUP") { updateCloseup(dt); if (G.state === "CLOSEUP") drawCloseup(); }
    else if (G.state === "MINEROOM") { updateMineRoom(dt); if (G.state === "MINEROOM") { drawMineRoom(); drawHUD(); } }
    else if (G.state === "CAFE") { updateCafe(dt); if (G.state === "CAFE") { drawCafe(); drawHUD(); if (G.machineMenu) drawMachineMenuOverlay(); } }
    else if (G.state === "BOXINTRO") { updateBoxIntro(dt); }

// =====================================================================
//  V4 — CHARACTER ART
//  Every figure is authored in local space: feet at (0,0), facing +x,
//  ~64 units tall. Limbs are 2-bone IK so knees/elbows really bend, and
//  stride is driven by distance travelled so feet don't skate.
// =====================================================================
function capsule(x1, y1, x2, y2, wd, fill, edge){
    ctx.lineCap = "round";
    if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = wd + 2.2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
    ctx.strokeStyle = fill; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ball(x, y, r, light, dark, edge){
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, light); g.addColorStop(1, dark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 0.9; ctx.stroke(); }
}
// two-bone IK: joint position for a limb from a→b with equal bone lengths.
// bend -1 = knee forward (legs), +1 = elbow back (arms) for a figure facing +x
function ikJoint(ax, ay, bx, by, len, bend){
    const dx = bx - ax, dy = by - ay, d0 = Math.hypot(dx, dy) || 0.001, d = Math.min(d0, len * 2 - 0.01);
    const off = Math.sqrt(Math.max(0, len * len - (d / 2) * (d / 2)));
    return { x: (ax + bx) / 2 + (-dy / d0) * off * bend, y: (ay + by) / 2 + (dx / d0) * off * bend };
}
// foot targets for a two-legged gait: lifted foot swings forward, planted foot pushes back
function feetGait(phase, stride, lift){
    return [0, Math.PI].map(o => { const ph = phase + o; return { x: -Math.cos(ph) * stride, y: -Math.max(0, Math.sin(ph)) * lift }; });
}
function applyStageLight(sx, sy, w, h){
    const g = ctx.createLinearGradient(sx, sy - h * 1.05, sx, sy);
    g.addColorStop(0, "rgba(255,248,225,0.11)"); g.addColorStop(0.45, "rgba(255,248,225,0.02)"); g.addColorStop(1, "rgba(0,0,0,0.08)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, sy - h * 0.52, w * 0.55, h * 0.56, 0, 0, TAU); ctx.fill();
}

const SKY_STARS = Array.from({ length: 300 }, (_, i) => ({
    x: hash(i * 3.1) * WIDTH * 2, y: hash(i * 7.7) * (GROUND_Y - 80), r: 0.5 + hash(i * 1.3) * 1.8,
    layer: i % 3, tw: hash(i * 9.1) * 10, tint: i % 11 === 0 ? "#ffd8a8" : i % 13 === 0 ? "#a8c8ff" : "#ffffff" }));
const wrapX = (x, span) => ((x % span) + span) % span;

function drawSkyStars(alpha){
    const par = [0.03, 0.06, 0.11];
    for (const s of SKY_STARS) {
        const x = wrapX(s.x - G.camX * par[s.layer], WIDTH * 2) - WIDTH * 0.5;
        if (x < -4 || x > WIDTH + 4) continue;
        ctx.globalAlpha = alpha * (0.35 + 0.55 * Math.abs(Math.sin(G.t * (1 + s.layer * 0.6) + s.tw)));

}

    const g = ctx.createLinearGradient(0, 0, 0, HEIGHT);

    for (const [fx, y, r, c] of neb) {

    ctx.save(); ctx.translate(px, py); ctx.rotate(-0.35);

    }
}

    ctx.fillStyle = dg; ctx.fillRect(0, top, WIDTH, front - top);

    for (let x = start; x < G.camX + WIDTH + 200; x += pw) {
        const f0 = x - G.camX, f1 = f0 + pw, b0 = deckBackX(f0), b1 = deckBackX(f1), n = hash(x * 0.013);
        if (dark.has(Math.floor(x / pw))) {

            ctx.strokeStyle = "rgba(10,6,2,0.8)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(lerp(b0, f0, 0.2) + 14, lerp(top, front, 0.2)); ctx.lineTo(lerp(b0, f0, 0.55) + 22, lerp(top, front, 0.55)); ctx.lineTo(lerp(b0, f0, 0.8) + 16, lerp(top, front, 0.8)); ctx.stroke();

function hillLayer(baseY, par, col, amp, freq, seed){
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, HEIGHT);

}
function drawPixelCanopy(cx, cy, r, s, seed){
    const sz = 7 * s, shades = ["#163a22", "#1f4e2c", "#2c6a3a", "#3f8a4a"];
    for (let gy = -r; gy <= r; gy++) for (let gx = -r; gx <= r; gx++) {
        if (gx * gx + gy * gy * 1.3 > r * r + hash(seed + gx * 3 + gy * 7) * 2) continue;
        const shade = gy < -r * 0.3 && gx < 0 ? 3 : gy < 0 ? 2 : gy < r * 0.5 ? 1 : 0;
        ctx.fillStyle = shades[Math.max(0, shade - (hash(seed + gx + gy * 13) > 0.8 ? 1 : 0))];
        ctx.fillRect(cx + gx * sz, cy + gy * sz, sz + 0.5, sz + 0.5);
    }
}

function updateGarden(dt){
    const p = G.player;
    for (const mp of G.gardenPlants) {
        if (mp.dead) continue;
        if (mp.hitFlash > 0) mp.hitFlash -= dt;
        const dx = p.x - mp.x, dist = Math.abs(dx);
        if (dist > 900) continue;
        if (mp.state === "idle" || mp.state === "windup") mp.face = dx >= 0 ? 1 : -1;
        mp.timer -= dt;
        if (mp.state === "idle") {
            if (dist < 170 && mp.timer <= 0) { mp.state = "windup"; mp.timer = 0.65; playTone(jit(140), 0.4, 0.14 * VOL.robot, 'sawtooth', 90); }
        } else if (mp.state === "windup") {
            if (mp.timer <= 0) { mp.state = "bite"; mp.timer = 0.22; mp.hit = false; playTone(jit(260), 0.1, 0.22 * VOL.robot, 'square', 70); }
        } else if (mp.state === "bite") {
            if (!mp.hit && dist < 92 * mp.s && Math.sign(dx) === mp.face && Math.abs(p.y - mp.d) < 34 && p.hopY > -40) {
                damagePlayerHit(13); mp.hit = true; screenShakeKick(0.6);
            }
            if (mp.timer <= 0) { mp.state = "chew"; mp.timer = 1.3; }
        } else if (mp.state === "chew" && mp.timer <= 0) { mp.state = "idle"; mp.timer = 0.4; }
    }
    for (const l of G.lasers) {
        if (l.dead) continue;
        for (const mp of G.gardenPlants) {
            if (mp.dead || Math.abs(l.x - mp.x) > 30 || Math.abs(l.y - mp.d) > 28) continue;
            mp.hp -= p.dmg * (l.mult || 1); mp.hitFlash = 0.15; l.dead = true;
            if (mp.hp <= 0) {
                mp.dead = true; gainOmp(10);
                for (let i = 0; i < 18; i++) G.particles.push({ x: mp.x, y: mp.d - 40, vx: rnd(-3, 3), vy: rnd(-4, 1), life: 0.8, max: 0.8, color: i % 2 ? "#5fae3a" : "#b8234a", g: 0.15 });
            }
            break;
        }
    }
}

// ---------------------------------------------------------------- riddles
function puzzleTarget(pz, i){
    if (pz.type === "mirror") return pz.plants[pz.n - 1 - i];
    if (pz.type === "invert") return !pz.plants[i];
    return pz.plants[i];
}
function puzzleSolved(pz){
    if (pz.type === "sequence") return false;
    for (let i = 0; i < pz.n; i++) if (pz.levers[i] !== puzzleTarget(pz, i)) return false;
    return true;
}
function puzzleLayout(pz){
    const cx = WIDTH / 2, cy = HEIGHT / 2 + 20, span = Math.min(640, pz.n * 96), xs = [];
    for (let i = 0; i < pz.n; i++) xs.push(cx - span / 2 + span * (i + 0.5) / pz.n);
    return { cx, cy, xs, plantY: cy - 140, leverY: cy + 40, chest: { x: cx, y: cy - 30 }, lantern: { x: cx, y: cy + 128 } };
}
function openPuzzle(door){
    if (CLOSEUP_KINDS.includes(door.type)) { openGardenCloseup(door); return; }
    const n = door.n, plants = Array.from({ length: n }, () => Math.random() < 0.5);
    if (plants.every(v => v) || plants.every(v => !v)) { const i = Math.floor(Math.random() * n); plants[i] = !plants[i]; }
    const pz = { door, type: door.type, n, plants, levers: Array(n).fill(false), solved: false, chestOpened: false,
        seq: [], step: 0, showT: 0, phase: "play", lastShown: -1, revealT: 0, pull: Array(n).fill(0), flash: Array(n).fill(0), wrongT: 0, solveT: 0 };
    if (pz.type === "sequence") {
        const len = Math.min(n + 1, 3 + Math.floor(door.idx / 3));
        for (let i = 0; i < len; i++) pz.seq.push(Math.floor(Math.random() * n));
        pz.phase = "show";
    } else {
        let guard = 0;
        do { pz.levers = pz.levers.map(() => Math.random() < 0.5); } while (puzzleSolved(pz) && ++guard < 50);
        if (pz.type === "memory") pz.revealT = 4.0;
    }
    G.puzzle = pz; G.state = "PUZZLE"; G.player.ax = 0; G.player.ay = 90; /* start well away from the exit gate */ G.doorCooldown = 0.6; sfx.door();
    showMessage(`КЛУМБА ${ROMAN[door.idx - 1]}`, 1.6);
}
function solvePuzzle(pz){
    pz.solved = true; pz.solveT = 2.5; pz.phase = "done"; pz.door.unlocked = true; G.checkpointX = Math.max(G.checkpointX, pz.door.x + 40);
    chime([523, 659, 784, 1046, 1318], 0.1, 0.22, 'sine');
    showMessage("КЛУМБА РАСЦВЕЛА! Дверь откроется, когда выйдешь. Сундук — E", 2.6);
}
function updatePuzzle(dt){
    const pz = G.puzzle, p = G.player; if (!pz) return;
    const L = puzzleLayout(pz);
    p.ax = clamp(p.ax + I.x * p.speed * 1.5, -420, 420);
    p.ay = clamp(p.ay + I.y * p.speed * 1.5, -80, 200);
    for (let i = 0; i < pz.n; i++) { if (pz.pull[i] > 0) pz.pull[i] = Math.max(0, pz.pull[i] - dt * 3); if (pz.flash[i] > 0) pz.flash[i] -= dt; }
    if (pz.revealT > 0) pz.revealT -= dt;
    if (pz.solveT > 0) pz.solveT -= dt;
    if (pz.phase === "wrong") { pz.wrongT -= dt; if (pz.wrongT <= 0) { pz.phase = "show"; pz.showT = 0; pz.step = 0; pz.lastShown = -1; } }
    if (pz.phase === "show") {
        pz.showT += dt;
        const k = Math.floor(pz.showT / 0.8);
        if (k < pz.seq.length && k !== pz.lastShown) { pz.lastShown = k; playTone(PLANT_NOTES[pz.seq[k]], 0.4, 0.2 * VOL.music + 0.03, 'sine'); }
        if (pz.showT > pz.seq.length * 0.8 + 0.3) pz.phase = "input";
    }
    if (!I.interact) return;
    I.interact = false;
    const px = L.cx + p.ax, py = L.cy + p.ay;
    if (py > L.cy + 165 && Math.abs(px - L.cx) < 80) { exitPuzzle(); return; }
    if (pz.solved && !pz.chestOpened && Math.hypot(px - L.chest.x, py - L.chest.y) < 70) {
        pz.chestOpened = true; pz.door.solved = true; p.inventory.keys++; gainOmp(120);
        chime([659, 784, 988, 1318], 0.09, 0.22); showMessage("НАГРАДА: КЛЮЧ + 120 ОМП", 2.4);
        return;
    }
    if (pz.type === "memory" && !pz.solved && Math.hypot(px - L.lantern.x, py - L.lantern.y) < 60) { pz.revealT = 2.0; sfx.heal(); return; }
    for (let i = 0; i < pz.n; i++) {
        if (Math.abs(px - L.xs[i]) > 36 || Math.abs(py - L.leverY) > 55) continue;
        if (pz.solved) return;
        pz.pull[i] = 1; playTone(jit(320), 0.07, 0.2 * VOL.robot, 'square', 160);
        if (pz.type === "sequence") {
            if (pz.phase !== "input") return;
            pz.flash[i] = 0.5; playTone(PLANT_NOTES[i], 0.3, 0.2 * VOL.music + 0.03, 'sine');
            if (pz.seq[pz.step] === i) { pz.step++; if (pz.step >= pz.seq.length) solvePuzzle(pz); }
            else { pz.phase = "wrong"; pz.wrongT = 1.1; sfx.bad(); showMessage("Не тот порядок... цветы покажут снова.", 1.6); }
        } else {
            pz.levers[i] = !pz.levers[i];
            if (puzzleSolved(pz)) solvePuzzle(pz);
        }
        return;
    }
}

function drawPuzzleScreen(){

    const L = puzzleLayout(pz), t = G.t;
    const sky = ctx.createLinearGradient(0, 0, 0, 220); sky.addColorStop(0, "#060a20"); sky.addColorStop(1, "#1c2a58");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawSkyStars(0.6);
    const mx = WIDTH - 150, my = 84;
    const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 90); mg.addColorStop(0, "rgba(200,220,255,0.25)"); mg.addColorStop(1, "rgba(200,220,255,0)");
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 90, 0, TAU); ctx.fill();
    ball(mx, my, 26, "#fffbe8", "#c9cfe0");
    if (pz.type === "invert") { ctx.fillStyle = "#121c46"; ctx.beginPath(); ctx.arc(mx, my + 11, 24, 0, TAU); ctx.fill(); }   // an upside-down crescent
    ctx.fillStyle = "#0f2a18"; ctx.fillRect(0, 150, WIDTH, 80);
    for (let i = 0; i < 70; i++) { ctx.fillStyle = i % 3 ? "#173c22" : "#215030"; ctx.beginPath(); ctx.arc(hash(i) * WIDTH, 150 + hash(i + 9) * 80, 10 + hash(i + 3) * 8, 0, TAU); ctx.fill(); }
    const lawn = ctx.createLinearGradient(0, 220, 0, HEIGHT); lawn.addColorStop(0, "#1d4a28"); lawn.addColorStop(1, "#0c2212");
    ctx.fillStyle = lawn; ctx.fillRect(0, 220, WIDTH, HEIGHT - 220);
    for (let i = 0; i < 120; i++) { ctx.fillStyle = i % 2 ? "#245a30" : "#173f22"; ctx.fillRect(hash(i * 1.7) * WIDTH, 230 + hash(i * 2.3) * (HEIGHT - 240), 2, 5); }
    ctx.strokeStyle = `rgba(60,255,220,${0.35 + 0.2 * Math.sin(t * 2)})`; ctx.lineWidth = 3; ctx.strokeRect(40, 228, WIDTH - 80, HEIGHT - 260);
    for (let i = 0; i < 9; i++) { const y = L.cy + 64 + i * 18, w = 40 + hash(i) * 20; ctx.fillStyle = i % 2 ? "#6a6a72" : "#5a5a62"; ctx.beginPath(); ctx.ellipse(L.cx + (hash(i * 3) - 0.5) * 20, y, w / 2, 7, 0, 0, TAU); ctx.fill(); }
    // flowerbed with a brick border
    const bedW = (L.xs[L.xs.length - 1] - L.xs[0]) + 110;
    ctx.fillStyle = "#3a2618"; ctx.beginPath(); ctx.roundRect(L.cx - bedW / 2, L.plantY - 30, bedW, 48, 10); ctx.fill();
    for (let x = L.cx - bedW / 2; x < L.cx + bedW / 2 - 4; x += 18) { ctx.fillStyle = hash(x) > 0.5 ? "#9c5a44" : "#b06a4e"; ctx.fillRect(x, L.plantY + 12, 16, 7); }
    for (let i = 0; i < pz.n; i++) drawPuzzlePlant(L.xs[i], L.plantY + 8, plantShown(pz, i), i, t);
    if (pz.type === "mirror") {
        const py = L.cy - 72;
        ctx.fillStyle = "#0e2a44"; ctx.beginPath(); ctx.ellipse(L.cx, py, bedW / 2, 24, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#6a6a72"; ctx.lineWidth = 3; ctx.stroke();
        ctx.save(); ctx.beginPath(); ctx.ellipse(L.cx, py, bedW / 2 - 4, 21, 0, 0, TAU); ctx.clip();
        ctx.globalAlpha = 0.5;
        for (let i = 0; i < pz.n; i++) {       // the reflection shows the bed reversed — and that is the answer
            ctx.save(); ctx.translate(L.xs[i], py - 16); ctx.scale(0.55, -0.42); drawPuzzlePlant(0, 0, pz.plants[pz.n - 1 - i], pz.n - 1 - i, t); ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(180,220,255,0.25)"; ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(L.cx + Math.sin(t + i) * 60, py + 4, 20 + i * 8, 2, 0, 0, TAU); ctx.stroke(); }
        ctx.restore();
    }
    for (let i = 0; i < pz.n; i++) drawLever(L.xs[i], L.leverY, pz.levers[i], pz.pull[i], i, pz.type === "sequence");
    if (pz.type === "memory" && !pz.solved) {
        const lx = L.lantern.x, ly = L.lantern.y;
        const lg = ctx.createRadialGradient(lx, ly - 46, 2, lx, ly - 46, 50); lg.addColorStop(0, "rgba(190,210,255,0.6)"); lg.addColorStop(1, "rgba(190,210,255,0)");
        ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly - 46, 50, 0, TAU); ctx.fill();
        ctx.fillStyle = "#1a1a22"; ctx.fillRect(lx - 2, ly - 40, 4, 40);
        ball(lx, ly - 46, 8, "#f0f4ff", "#8a9ac8");
        ctx.fillStyle = "#1a1a22"; ctx.beginPath(); ctx.arc(lx + 3, ly - 48, 6, 0, TAU); ctx.fill();   // crescent-moon lamp
    }
    if (pz.solved) {
        const cx = L.chest.x, cy = L.chest.y;
        if (!pz.chestOpened) { const bg = ctx.createLinearGradient(0, cy - 140, 0, cy); bg.addColorStop(0, "rgba(255,220,120,0)"); bg.addColorStop(1, `rgba(255,220,120,${0.35 + 0.15 * Math.sin(t * 4)})`); ctx.fillStyle = bg; ctx.fillRect(cx - 30, cy - 140, 60, 140); }
        ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(cx, cy + 4, 30, 6, 0, 0, TAU); ctx.fill();
        const cg = ctx.createLinearGradient(0, cy - 26, 0, cy); cg.addColorStop(0, "#9a6a30"); cg.addColorStop(1, "#5a3a18");
        ctx.fillStyle = cg; ctx.fillRect(cx - 26, cy - 24, 52, 26); ctx.strokeStyle = "#2a1a08"; ctx.lineWidth = 1.5; ctx.strokeRect(cx - 26, cy - 24, 52, 26);
        ctx.fillStyle = "#c8a838"; ctx.fillRect(cx - 26, cy - 14, 52, 3); ctx.fillRect(cx - 3, cy - 18, 6, 8);
        ctx.fillStyle = "#7a5228";
        if (pz.chestOpened) { ctx.beginPath(); ctx.moveTo(cx - 26, cy - 24); ctx.lineTo(cx + 26, cy - 24); ctx.lineTo(cx + 22, cy - 44); ctx.lineTo(cx - 22, cy - 44); ctx.closePath(); ctx.fill(); }
        else { ctx.beginPath(); ctx.ellipse(cx, cy - 24, 26, 10, 0, Math.PI, TAU); ctx.fill(); ctx.strokeStyle = "#2a1a08"; ctx.stroke(); }
        if (pz.solveT > 0) for (let i = 0; i < 14; i++) { const a = i / 14 * TAU + t * 2, r = 40 + (2.5 - pz.solveT) * 60; ctx.fillStyle = `rgba(255,240,150,${pz.solveT / 2.5})`; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy - 20 + Math.sin(a) * r * 0.5, 2.2, 0, TAU); ctx.fill(); }
    }
    // exit gate
    const gy = L.cy + 205;
    ctx.strokeStyle = "#1a4a26"; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(L.cx, gy, 52, Math.PI, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(60,255,220,${0.2 + 0.1 * Math.sin(t * 3)})`; ctx.beginPath(); ctx.arc(L.cx, gy, 42, Math.PI, TAU); ctx.fill();
    // tablet with the riddle
    ctx.fillStyle = "rgba(70,70,80,0.92)"; ctx.beginPath(); ctx.roundRect(60, 240, 380, 40, 8); ctx.fill(); ctx.strokeStyle = "#2a2a30"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "rgba(80,150,60,0.6)"; ctx.fillRect(64, 244, 60, 4);
    const hint = PUZZLE_HINTS[pz.type === "match" && pz.door.idx === 1 ? "match1" : pz.type];
    drawText(`КЛУМБА ${ROMAN[pz.door.idx - 1]}`, 15, "#bffff0", 250, 264, true);
    if (pz.type === "sequence" && !pz.solved) drawText(pz.phase === "show" ? "СМОТРИ..." : pz.phase === "wrong" ? "ОШИБКА" : `ПОВТОРИ! ${pz.step}/${pz.seq.length}`, 18, pz.phase === "wrong" ? "#ff7a7a" : "#ffe46a", L.cx, L.plantY - 70, true);
    const moving = Math.abs(I.x) > 0.1 || Math.abs(I.y) > 0.1;
    drawPlayerGraphics(L.cx + p.ax, L.cy + p.ay, p.w, p.h, I.facing, t, false, p.hp / p.maxHp, moving, p.hitFlash, p.landSquash);
    const px = L.cx + p.ax, py = L.cy + p.ay;
    let prompt = null;
    if (py > L.cy + 165 && Math.abs(px - L.cx) < 80) prompt = "E — вернуться на тропу";
    else if (pz.solved && !pz.chestOpened && Math.hypot(px - L.chest.x, py - L.chest.y) < 70) prompt = "E — открыть сундук";
    else if (pz.type === "memory" && !pz.solved && Math.hypot(px - L.lantern.x, py - L.lantern.y) < 60) prompt = "E — зажечь лунный фонарь";
    else for (let i = 0; i < pz.n; i++) if (Math.abs(px - L.xs[i]) <= 36 && Math.abs(py - L.leverY) <= 55 && !pz.solved) prompt = pz.type === "sequence" ? `E — дёрнуть рычаг ${ROMAN[i]}` : `E — переключить рычаг ${ROMAN[i]}`;
    if (prompt) drawText(prompt, 16, "#ffcf3f", WIDTH / 2, HEIGHT - 26, true);
    const r = PUZZLE_EXIT_BTN;
    ctx.fillStyle = "#2a1414"; ctx.strokeStyle = "#ff7878"; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill(); ctx.stroke();
    drawText("← К ТРОПЕ (Esc)", 16, "#ffffff", r.x + r.w / 2, r.y + 31, true);
    drawVignette(0.3);
}

const mobileControlsEl = document.getElementById('mobileControls');
let lastControlsVisible = null;

//  V5 — fixes & features
