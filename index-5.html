const LANE_Y = -8;                          // 2D: everyone walks one lane on the boardwalk
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const IS_TOUCH = (typeof window !== "undefined" && "ontouchstart" in window) || (typeof navigator !== "undefined" && navigator.maxTouchPoints > 0);

// ---------------------------------------------------------------- hit flash without ctx.filter
// ctx.filter stalls the renderer for a moment every time it's switched on — that was the
// freeze on every hit. Instead the figure is drawn into a small offscreen buffer, only its
// own pixels get tinted, and the result is stamped onto the screen.
const FX = (() => { const c = document.createElement("canvas"); c.width = 420; c.height = 420; return { c, x: c.getContext("2d") }; })();
function drawTinted(fn, sx, sy, color, amount){
    const main = ctx, ox = 210, oy = 340;
    ctx = FX.x;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.clearRect(0, 0, 420, 420);
    try { fn(ox, oy); } finally { ctx = main; }
    const f = FX.x;
    f.setTransform(1, 0, 0, 1, 0, 0); f.globalCompositeOperation = "source-atop"; f.globalAlpha = clamp(amount, 0, 1);
    f.fillStyle = color; f.fillRect(0, 0, 420, 420);
    f.globalCompositeOperation = "source-over"; f.globalAlpha = 1;
    ctx.drawImage(FX.c, sx - ox, sy - oy);
}

function drawRobotGraphics(sx, sy, w, h, r, t){
    const k = h / 62, vx = r.vx || 0, dir = r.faceDir || (vx < 0 ? -1 : 1);
    const amp = r.walkAmp != null ? r.walkAmp : clamp(Math.abs(vx) / 1.1, 0, 1);
    const a = { t: t + (r.seed || 0), phase: r.walkPhase != null ? r.walkPhase : (r.x || sx) * 0.1, amp,
        attack: r.attacking ? 1 : (r.attackAnim || 0), windup: r.windup || 0, throwAnim: r.throwAnim || 0, airborne: (r.hopY || 0) < -2 };
    const hop = r.hopY || 0, draw = ART[r.kind] || artSkeleton;
    drawShadow(sx, sy + 5, w * clamp(1 + hop * 0.006, 0.5, 1));
    const figure = (ox, oy) => {
        ctx.save();
        if (r.dead) ctx.globalAlpha = Math.max(0, 1 - (r.fade || 0) / 24);
        ctx.translate(ox + (r.knockback || 0), oy + hop);
        if (r.dead) ctx.rotate(-dir * Math.min(1, (r.fade || 0) / 12) * 1.35);
        if ((r.landSquash || 0) > 0) ctx.scale(1 + r.landSquash * 0.15, 1 - r.landSquash * 0.18);
        if (r.kind === "dancer" && Math.abs(vx) > 1.6 && !r.dead)
            for (let i = 2; i >= 1; i--) { ctx.save(); ctx.globalAlpha = 0.13; ctx.translate(-dir * i * 9, 0); ctx.scale(dir * k, k); draw(a); ctx.restore(); }
        ctx.scale(dir * k, k);
        draw(a);
        ctx.restore();
    };
    if (r.hitFlash > 0) drawTinted(figure, sx, sy, "#ffffff", 0.8);
    else if (r.isShadow) { ctx.save(); ctx.globalAlpha = 0.85; drawTinted(figure, sx, sy, "#4a7cff", 0.6); ctx.restore(); }
    else figure(sx, sy);
    if (r.isShadow) {
        const g = ctx.createRadialGradient(sx, sy - h * 0.5, 4, sx, sy - h * 0.5, h * 0.75);
        g.addColorStop(0, "rgba(90,140,255,0.22)"); g.addColorStop(1, "rgba(90,140,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy - h * 0.5, h * 0.75, 0, TAU); ctx.fill();
    }
    if (r.buffing && !r.dead) {
        ctx.strokeStyle = r.kind === "clown" ? `rgba(255,207,63,${0.3 + 0.15 * Math.sin(t * 4)})` : `rgba(120,220,255,${0.3 + 0.15 * Math.sin(t * 5)})`;
        ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sx, sy + 2, w * 0.9, w * 0.26, 0, 0, TAU); ctx.stroke();
    }
    if (!r.dead) applyStageLight(sx, sy + hop, w, h);
    if (!r.dead && r.hp < r.maxHp) drawPipBar(sx - w * 0.45, sy + hop - h * 1.2, w * 0.9, 4, r.hp, r.maxHp, 6, r.isShadow ? "#7aa8ff" : "#50f05a", "#280000", 1.5);
}

// ---------------------------------------------------------------- shield sphere

function drawPlayerGraphics(sx, sy, w, h, facing, t, muzzle, hpRatio, moving, hitFlash = 0, squash = 0){
    const p = G.player, k = h / 64, amp = moving ? 1 : 0, phase = t * 9, recoil = p.recoil || 0;
    drawShadow(sx, sy + 5, w * 1.05);
    const figure = (ox, oy) => {
        ctx.save(); ctx.translate(ox, oy);
        if (squash > 0.01) ctx.scale(1 + squash * 0.16, 1 - squash * 0.2);
        if (facing === "left" || facing === "right") { ctx.scale((facing === "right" ? 1 : -1) * k, k); arkSide(t, phase, amp, recoil, muzzle, hpRatio); }
        else if (facing === "back") { ctx.scale(k, k); arkBack(t, phase, amp, recoil, muzzle); }
        else { ctx.scale(k, k); arkFront(t, phase, amp, recoil, muzzle, hpRatio); }
        ctx.restore();
    };
    if (hitFlash > 0) drawTinted(figure, sx, sy, "#ff3030", Math.min(0.65, hitFlash * 3));
    else if (p.immortal) drawTinted(figure, sx, sy, "#ffe86b", 0.3 + 0.15 * Math.sin(t * 10));
    else figure(sx, sy);
    applyStageLight(sx, sy, w, h);
    if (p.immortal) { ctx.strokeStyle = `rgba(255,232,107,${0.6 + 0.3 * Math.sin(t * 8)})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(sx, sy - h * 1.08, w * 0.42, 6, 0, 0, TAU); ctx.stroke(); }
    if (p.shield > 0.05 || (p.shieldHit || 0) > 0) drawShieldSphere(sx, sy - h * 0.5, h * 0.72, p.shield / Math.max(1, p.maxShield), p.shieldHit || 0, t);
    if (p.maskTimer > 0) { const off = facing === "right" ? 4 : facing === "left" ? -4 : 0; drawComedyMask(sx + off * k, sy - 50 * k, p.maskTimer); }
}

function updatePlayerTimers(dt){
    const p = G.player, ab = p.abilities;
    if (ab.dodgeCd > 0) ab.dodgeCd -= dt;
    if (ab.immortalCd > 0) ab.immortalCd -= dt;
    if (ab.shadowCd > 0) ab.shadowCd -= dt;
    if (p.immortal) { p.immortalTimer -= dt; if (p.immortalTimer <= 0) p.immortal = false; }
    if (p.hitFlash > 0) p.hitFlash -= dt;
    if (p.shieldHit > 0) p.shieldHit = Math.max(0, p.shieldHit - dt);
    if (p.landSquash > 0) p.landSquash = Math.max(0, p.landSquash - dt * 6);
    if (p.maskTimer > 0) p.maskTimer -= dt;
    if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 9);
}

// 2D shooting: left/right along the road, W (back) aims up at flying things,
// S keeps firing forward. The arena keeps full 4-way aiming.
function firePlayerWeapon(dt, p, inArena){
    if (I.fire && p.fireCd <= 0) {
        let fv = facingVector(I.facing);
        const up = !inArena && I.facing === "back";
        if (!inArena && I.facing === "front") fv = { x: I.aimDir, y: 0 };
        const kind = p.abilities.rocket ? "rocket" : (p.abilities.doubleShot ? "double" : "normal");
        const sp = LASER_SPEED * (kind === "rocket" ? 0.8 : 1);
        const bx = inArena ? p.ax : p.x, by = inArena ? p.ay : p.y;
        const h = -34 + (inArena ? 0 : p.hopY) - (up ? 22 : 0);
        const mk = (ox, oy, dh = 0) => up
            ? { x: bx + ox, y: by, h: h + dh, startX: bx + ox, startY: by, vx: 0, vy: 0, vh: -sp, kind, dead: false, up: true, mult: kind === "rocket" ? 1.15 : kind === "double" ? 0.6 : 1, lo: p.laneOff || 0 }
            : { x: bx + fv.x * 22 + ox, y: by + (inArena ? fv.y * 14 : 0) + oy, h: h + dh, startX: bx + fv.x * 22 + ox, startY: by + (inArena ? fv.y * 14 : 0) + oy,
                vx: fv.x * sp, vy: inArena ? fv.y * sp : 0, kind, dead: false, mult: kind === "rocket" ? 1.15 : kind === "double" ? 0.6 : 1, lo: inArena ? 0 : (p.laneOff || 0) };
        if (kind === "double") {
            if (up) { G.lasers.push(mk(-5, 0)); G.lasers.push(mk(5, 0)); }
            else if (inArena) { const ox = -fv.y * 7, oy = fv.x * 7; G.lasers.push(mk(ox, oy)); G.lasers.push(mk(-ox, -oy)); }
            else { G.lasers.push(mk(0, 0, -4)); G.lasers.push(mk(0, 0, 4)); }
        } else if (kind === "rocket" && p.abilities.doubleShot) {   // both from the casino → twin rockets
            const a = up ? mk(-6, 0) : mk(0, 0, -5), c = up ? mk(6, 0) : mk(0, 0, 5); a.mult = c.mult = 1.15 * 0.7; G.lasers.push(a); G.lasers.push(c);
        } else G.lasers.push(mk(0, 0));
        (kind === "rocket" ? sfx.rocket : sfx.laser)();
        p.fireCd = kind === "rocket" ? 0.65 : kind === "double" ? 0.2 : 0.18;   // balanced: rockets hit harder but slower
        p.recoil = 1;
    }
    if (p.fireCd > 0) p.fireCd -= dt;
}

// ---------------------------------------------------------------- free joystick + big buttons
(function setupTouchControls(){
    const area = document.getElementById("joyArea"), base = document.getElementById("joyBase"), knob = document.getElementById("joyKnob");
    if (!area || !area.addEventListener) return;
    const R = 62; let pid = null, cx = 0, cy = 0;
    const local = e => { const r = stage.getBoundingClientRect(), s = r.width / 1280; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; };
    const idle = () => { base.style.left = "170px"; base.style.top = "560px"; base.style.opacity = "0.3"; knob.style.transform = "translate(0px,0px)"; };
    idle();
    area.addEventListener("pointerdown", e => {
        if (pid !== null) return;
        pid = e.pointerId; if (area.setPointerCapture) area.setPointerCapture(pid);
        const p = local(e); cx = p.x; cy = p.y;
        base.style.left = cx + "px"; base.style.top = cy + "px"; base.style.opacity = "1";
        touchAxis.active = true; touchAxis.x = 0; touchAxis.y = 0; e.preventDefault();
    });
    area.addEventListener("pointermove", e => {
        if (e.pointerId !== pid) return;
        const p = local(e); let dx = p.x - cx, dy = p.y - cy; const d = Math.hypot(dx, dy);
        if (d > R) { dx = dx / d * R; dy = dy / d * R; }
        knob.style.transform = `translate(${dx}px,${dy}px)`;
        touchAxis.x = Math.abs(dx / R) < 0.18 ? 0 : dx / R; touchAxis.y = Math.abs(dy / R) < 0.35 ? 0 : dy / R;   // generous dead-zone vertically, so walking doesn't flip you to "aim up"
        e.preventDefault();
    });
    const end = e => { if (e.pointerId !== pid) return; pid = null; touchAxis.active = false; touchAxis.x = 0; touchAxis.y = 0; idle(); };
    area.addEventListener("pointerup", end); area.addEventListener("pointercancel", end);
})();
function bindBtn(id, onDown, onUp){
    const el = document.getElementById(id);
    if (!el || !el.addEventListener) return;
    el.addEventListener("pointerdown", e => { if (el.classList) el.classList.add("pressed"); onDown(); e.preventDefault(); e.stopPropagation(); });
    const up = () => { if (el.classList) el.classList.remove("pressed"); if (onUp) onUp(); };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
    el.addEventListener("click", e => e.stopPropagation());
}
bindBtn("btnFire", () => touchFire = true, () => touchFire = false);
bindBtn("btnInteract", () => I.interact = true);
bindBtn("btnJump", () => I.jumpPressed = true);
function updateMobileControlsVisibility(){
    const visible = IS_TOUCH && ["PATH", "ISLAND", "ARENA", "MAZE", "PUZZLE", "CLOSEUP", "MINEROOM"].includes(G.state) && !G.machineMenu;
    if (visible !== lastControlsVisible) { mobileControlsEl.style.display = visible ? "block" : "none"; lastControlsVisible = visible; }
}

// ---------------------------------------------------------------- chase: longer, deadlier, readable obstacles
function drawCrate(cx, by, s){
    const w = 30 * s, h = 28 * s;
    const g = ctx.createLinearGradient(0, by - h, 0, by); g.addColorStop(0, "#9a7040"); g.addColorStop(1, "#5a3e22");
    ctx.fillStyle = g; ctx.fillRect(cx - w / 2, by - h, w, h);
    ctx.strokeStyle = "#2e2010"; ctx.lineWidth = 1.5; ctx.strokeRect(cx - w / 2, by - h, w, h);
    ctx.beginPath(); ctx.moveTo(cx - w / 2, by - h); ctx.lineTo(cx + w / 2, by); ctx.moveTo(cx + w / 2, by - h); ctx.lineTo(cx - w / 2, by); ctx.stroke();
    ctx.fillStyle = "#c81c22"; ctx.font = `bold ${Math.round(6 * s)}px Consolas`; ctx.textAlign = "center"; ctx.fillText("ТЕАТР", cx, by - h * 0.42);
}

// ---------------------------------------------------------------- Doors-style gates: back post, front post, beam
function doorOpenAmt(d){ return d.openAt != null ? smooth((G.t - d.openAt) / 0.9) : 0; }
function autoGateOpen(x){
    const p = G.player;
    let k = smooth((p.x - (x - 260)) / 140);
    if (p.x > x + 220) k *= 1 - smooth((p.x - (x + 220)) / 110);     // swings shut behind you
    return k;
}
function updateDoorGates(prevX){
    const p = G.player;
    if (G.admin && G.admin.noclip) return;
    for (const d of G.puzzleDoors) {
        if (d.unlocked) continue;
        if (prevX <= d.x - 30 && p.x > d.x - 34) {
            p.x = d.x - 34;
            if (G.messageTimer <= 0) showMessage(`ДВЕРЬ ${String(d.idx).padStart(2, "0")} ЗАПЕРТА — разгадай клумбу (E)`, 1.6);
        }
    }
}

// ---------------------------------------------------------------- gradual entry into the gardens
function gardenBlendAt(x){
    const ramp = 1600;
    if (x < GARDEN_START - ramp || x > GARDEN_END + ramp) return 0;
    if (x < GARDEN_START) return smooth((x - (GARDEN_START - ramp)) / ramp);
    if (x > GARDEN_END) return smooth(1 - (x - GARDEN_END) / ramp);
    return 1;
}
function overgrowthAt(x){
    const ramp = 1600;
    if (x > GARDEN_START - ramp && x < GARDEN_START) return smooth((x - (GARDEN_START - ramp)) / ramp);
    if (x > GARDEN_END && x < GARDEN_END + ramp) return smooth(1 - (x - GARDEN_END) / ramp);
    return 0;
}
function drawOvergrowth(){
    const top = DECK_TOP(), front = DECK_FRONT_Y();
    const x0 = Math.floor((G.camX - 40) / 9) * 9;
    for (let x = x0; x < G.camX + WIDTH + 40; x += 9) {
        const g = overgrowthAt(x); if (g <= 0) continue;
        const sx = x - G.camX, n = hash(x * 0.31);
        if (x % 54 === 0 && hash(x * 0.07) < g * 0.8) { ctx.fillStyle = `rgba(60,130,60,${0.25 + 0.35 * g})`; ctx.beginPath(); ctx.ellipse(sx + 10, lerp(top, front, hash(x)), 20 * g + 6, 4, 0, 0, TAU); ctx.fill(); }
        if (n < g * 0.9) {
            const y = lerp(top + 2, front - 2, hash(x * 1.7)), hgt = (4 + hash(x * 2.3) * 8) * (0.5 + g);
            ctx.strokeStyle = n < 0.3 ? "#3a8a3a" : "#2e6a34"; ctx.lineWidth = 1.3;
            ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx - 2 + Math.sin(G.t * 2 + x) * 1.5, y - hgt); ctx.moveTo(sx + 2, y); ctx.lineTo(sx + 4, y - hgt * 0.8); ctx.stroke();
            if (g > 0.55 && n < (g - 0.55) * 0.5) { ctx.fillStyle = PLANT_COLORS[Math.floor(hash(x) * 6)]; ctx.beginPath(); ctx.arc(sx - 2, y - hgt - 1, 1.8, 0, TAU); ctx.fill(); }
        }
    }
    for (let x = Math.floor((G.camX - 200) / 160) * 160; x < G.camX + WIDTH + 200; x += 160) {
        const g = overgrowthAt(x); if (g < 0.2) continue;
        const bx = deckBackX(x - G.camX);
        ctx.strokeStyle = "#2f7a3a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx - 4, top);
        for (let y = top; y > top - 40 * g; y -= 8) ctx.quadraticCurveTo(bx + 6, y - 4, bx - 4, y - 8);
        ctx.stroke();
        ctx.fillStyle = "#3a9a44"; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(bx + (i % 2 ? 5 : -5), top - 8 - i * 11 * g, 3.5, 1.8, i, 0, TAU); ctx.fill(); }
    }
}

function drawRootCrawler(m, sx, sy, t){

function cpNav(dt){

function updateCloseup(dt){

    if (cp.solved) { cp.solveT += dt; I.interact = false; if (cp.solveT > 1.5) closeCloseup(true); return; }

    if (k === "lights") {
        const s = cp.size; cp.cursor = (cp.cursor + dx + s) % s; cp.cy = (cp.cy + dy + s) % s;
        if (act) { lightsPress(cp, cp.cursor, cp.cy); cpClick(); if (cp.grid.every(v => v)) solveCloseup(); }
    } else if (k === "wires" || k === "vines") {

    } else if (k === "shapes" || k === "seeds") {

        }
    }
}

function mkBeastBase(kind, x){
    const hp = { moth: 26, crawler: 34, hypno: 34, burr: 22, spore: 30, vine: 30, wisp: 6 }[kind];
    const b = { kind, x, home: x, state: "idle", timer: rnd(0.5, 2), dead: false, hitFlash: 0, seed: Math.random() * 10, h: 0, vx: 0, cd: 0, charge: 0, hp, maxHp: hp };
    if (kind === "moth") { b.h = -95; b.state = "hover"; }
    if (kind === "crawler") { b.state = "burrow"; b.timer = 0; }
    if (kind === "wisp") b.h = -60 - Math.random() * 40;
    return b;
}
function beastBurst(m, cols){ for (let i = 0; i < 16; i++) G.particles.push({ x: m.x, y: (m.h || -30) + LANE_Y, vx: rnd(-3, 3), vy: rnd(-3, 1), life: 0.7, max: 0.7, color: cols[i % cols.length], g: 0.15 }); }
function updateGardenBeastsBase(dt){
    const p = G.player;
    if (p.hypno > 0) { p.hypno -= dt; if (p.hypnoSrc && p.hypnoSrc.dead) p.hypno = 0; }
    for (const c of (G.sporeClouds || [])) {
        c.life -= dt; c.r = Math.min(95, c.r + dt * 140);
        if (Math.abs(p.x - c.x) < c.r * 0.9 && p.hopY > -70) { damagePlayerTick(6 * dt); p.inSpore = true; }
    }
    G.sporeClouds = (G.sporeClouds || []).filter(c => c.life > 0);
    for (const m of (G.gardenBeasts || [])) {
        if (m.dead) continue;
        if (m.hitFlash > 0) m.hitFlash -= dt;
        const dx = p.x - m.x;
        if (Math.abs(dx) > 800) continue;
        m.timer -= dt;
        if (m.kind === "moth") {
            if (m.state === "hover") {
                m.x += clamp(p.x - Math.sign(dx || 1) * 130 - m.x, -2.2, 2.2); m.h = -95 + Math.sin(G.t * 3 + m.seed) * 10;
                if (m.timer <= 0 && Math.abs(dx) < 320) { m.state = "windup"; m.timer = 0.6; playTone(jit(900), 0.3, 0.1 * VOL.robot, "sine", 1400); }
            } else if (m.state === "windup") { if (m.timer <= 0) { m.state = "swoop"; m.timer = 0.55; m.sx0 = m.x; m.sh0 = m.h; m.tx = p.x; m.hit = false; } }
            else if (m.state === "swoop") {
                const k = 1 - m.timer / 0.55;
                m.x = lerp(m.sx0, m.tx + Math.sign((m.tx - m.sx0) || 1) * 60, k); m.h = m.sh0 + Math.sin(k * Math.PI) * 70;
                if (!m.hit && Math.abs(p.x - m.x) < 26 && Math.abs((p.hopY - 34) - m.h) < 30) { damagePlayerHit(10); m.hit = true; }
                if (m.timer <= 0) { m.state = "hover"; m.timer = rnd(1.6, 2.8); }
            }
        } else if (m.kind === "crawler") {
            if (m.state === "burrow") {
                m.x += clamp(dx, -2.4, 2.4);
                if (Math.random() < 0.25) G.particles.push({ x: m.x + rnd(-10, 10), y: LANE_Y - 2, vx: rnd(-1, 1), vy: rnd(-1.5, -0.4), life: 0.4, max: 0.4, color: "#5a3e22" });
                if (Math.abs(dx) < 16 && m.timer <= 0) { m.state = "rise"; m.timer = 0.7; playTone(110, 0.5, 0.2 * VOL.robot, "sawtooth", 60); }
            } else if (m.state === "rise") {
                if (m.timer <= 0) {
                    m.state = "up"; m.timer = 1.4; beastBurst({ x: m.x, h: -6 }, ["#5a3e22", "#3a8a3a"]);
                    if (Math.abs(p.x - m.x) < 44 && p.hopY > -30) { damagePlayerHit(16); screenShakeKick(0.5); }
                }
            } else if (m.state === "up" && m.timer <= 0) { m.state = "burrow"; m.timer = 2.0; }
        } else if (m.kind === "hypno") {
            if (m.cd > 0) m.cd -= dt;
            if (Math.abs(dx) < 240 && m.cd <= 0 && !(p.hypno > 0)) {
                m.charge += dt * 0.5;
                if (m.charge >= 1) { p.hypno = 2.4; p.hypnoSrc = m; m.charge = 0; m.cd = 4; playTone(330, 1.2, 0.2 * VOL.robot, "sine", 660); showMessage("ГИПНОЗ! Стреляй в цветок и вырывайся!", 1.6); }
            } else m.charge = Math.max(0, m.charge - dt * 0.6);
            if (p.hypno > 0 && p.hypnoSrc === m) {
                p.x += Math.sign(m.x - p.x) * 2.6;
                if (Math.abs(p.x - m.x) < 30) { damagePlayerHit(14); p.hypno = 0; m.cd = 3; screenShakeKick(0.4); }
            }
        } else if (m.kind === "burr") {
            if (m.cd > 0) { m.cd -= dt; m.vx *= 0.92; }
            else if (Math.abs(dx) < 520) m.vx += (Math.sign(dx || 1) * 3.4 - m.vx) * Math.min(1, dt * 2.5);
            m.x = clamp(m.x + m.vx, GARDEN_START + 40, GARDEN_END - 40); m.roll = (m.roll || 0) + m.vx * 0.08; m.h = -Math.abs(Math.sin(m.roll * 1.3)) * 6;
            if (Math.abs(p.x - m.x) < 20 && p.hopY > -24 && m.cd <= 0) { damagePlayerHit(12); m.vx = -Math.sign(dx || 1) * 5; m.cd = 1.0; screenShakeKick(0.3); }
        } else if (m.kind === "spore") {
            if (m.cd > 0) m.cd -= dt; m.puff = Math.max(0, (m.puff || 0) - dt * 2);
            if (Math.abs(dx) < 190 && m.cd <= 0) { m.cd = 5; m.puff = 1; G.sporeClouds.push({ x: m.x + Math.sign(dx || 1) * 40, r: 20, life: 3.4 }); playTone(180, 0.5, 0.15 * VOL.robot, "triangle", 90); }
        } else if (m.kind === "vine") {
            if (m.state === "idle") { if (Math.abs(dx) < 150 && m.timer <= 0) { m.state = "windup"; m.timer = 0.7; } }
            else if (m.state === "windup") { if (m.timer <= 0) { m.state = "whip"; m.timer = 0.3; m.hit = false; playTone(jit(500), 0.12, 0.2 * VOL.robot, "sawtooth", 120); } }
            else if (m.state === "whip") {
                if (!m.hit && Math.abs(p.x - m.x) < 55 && p.hopY > -50) { damagePlayerHit(15); m.hit = true; screenShakeKick(0.4); }
                if (m.timer <= 0) { m.state = "idle"; m.timer = 2.0; }
            }
        } else if (m.kind === "wisp") {
            if (Math.abs(dx) < 420) m.state = "chase";
            if (m.state === "chase") {
                const ty = -34 + p.hopY, ddx = p.x - m.x, ddy = ty - m.h, d = Math.hypot(ddx, ddy) || 1;
                m.x += ddx / d * 2.7 + Math.sin(G.t * 6 + m.seed) * 0.8; m.h += ddy / d * 2.7 + Math.cos(G.t * 5 + m.seed) * 0.8;
                if (d < 18) { damagePlayerHit(8); m.dead = true; beastBurst(m, ["#ffb83a", "#ff6a3a", "#fff2a0"]); playTone(jit(700), 0.15, 0.2 * VOL.robot, "square", 200); }
            } else m.h = -70 + Math.sin(G.t * 2 + m.seed) * 12;
        }
    }
    const hitTest = (m, l) => {
        if (m.kind === "moth" || m.kind === "wisp") return Math.abs(l.x - m.x) < (m.kind === "wisp" ? 16 : 22) && Math.abs(l.h - m.h) < (m.kind === "wisp" ? 18 : 24);
        if (m.kind === "crawler") return m.state === "up" && Math.abs(l.x - m.x) < 24 && l.h > -70;
        if (m.kind === "burr") return Math.abs(l.x - m.x) < 20 && l.h > -40;
        if (m.kind === "vine") return Math.abs(l.x - m.x) < 22 && (l.h < -70 || l.up);
        return Math.abs(l.x - m.x) < 26 && l.h > -84;
    };
    const cols = { moth: ["#8a3aa8", "#c8a0d8"], crawler: ["#5a3e22", "#9a7a4a"], hypno: ["#c86fff", "#ff8fd8"], burr: ["#6a8a3a", "#3a2a18"], spore: ["#b07acf", "#e8d8f8"], vine: ["#2f7a3a", "#6aba4a"], wisp: ["#ffb83a", "#fff2a0"] };
    for (const l of G.lasers) {
        if (l.dead) continue;
        for (const m of (G.gardenBeasts || [])) {
            if (m.dead || !hitTest(m, l)) continue;
            m.hp -= p.dmg * (l.mult || 1); m.hitFlash = 0.15; l.dead = true;
            if (m.hp <= 0) { m.dead = true; gainOmp(m.kind === "wisp" ? 4 : 12); beastBurst(m, cols[m.kind]); }
            break;
        }
    }
}

const GARDEN_ROOM_THEMES = [
    { id: "greenhouse", name: "Оранжерея" }, { id: "hedge", name: "Живой коридор" }, 
    { id: "roses", name: "Розовая аркада" }, { id: "grove", name: "Грибная роща" }, { id: "pumpkins", name: "Тыквенная грядка" } ];
const GARDEN_DOORS = 12;

// ---------------------------------------------------------------- garden layout: [1–3 rooms] → riddle door, ×12
function generateGarden(){
    G.gardenPlants = []; G.gardenProps = []; G.gardenFlowers = []; G.puzzleDoors = []; G.puzzle = null;
    G.gardenRooms = []; G.roomDoors = []; G.roomIdx = -1;
    const plan = []; let lastTheme = -1;
    for (let i = 1; i <= GARDEN_DOORS; i++) {
        const nRooms = 1 + Math.floor(Math.random() * 3);
        for (let r = 0; r < nRooms; r++) {
            let th; do { th = Math.floor(Math.random() * GARDEN_ROOM_THEMES.length); } while (th === lastTheme);
            lastTheme = th; plan.push({ kind: "room", len: rnd(650, 1000), theme: th, door: r < nRooms - 1 });
        }

    }
    const total = plan.reduce((s, q) => s + q.len, 0), k = ((GARDEN_END - 500) - (GARDEN_START + 300)) / total;
    const types = []; let bag = [];
    for (let i = 2; i <= GARDEN_DOORS; i++) {
        if (!bag.length) bag = shuffle(PUZZLE_TYPES.slice());
        let t = bag.pop();
        if (t === types[types.length - 1] && bag.length) { bag.unshift(t); t = bag.pop(); }
        types.push(t);
    }
    let cur = GARDEN_START + 300, roomN = 0;
    for (const q of plan) {
        const len = q.len * k;
        if (q.kind === "room") {
            roomN++; const th = GARDEN_ROOM_THEMES[q.theme];
            G.gardenRooms.push({ x0: cur, x1: cur + len, theme: th.id, name: th.name, n: roomN, seed: Math.random() * 100 });
            if (q.door) G.roomDoors.push({ x: cur + len, n: roomN + 1 });

        cur += len;

    for (let x = GARDEN_START + 320; x < GARDEN_END - 200; x += rnd(260, 440)) {

        G.gardenPlants.push({ x, d: LANE_Y + (back ? -2 : 2), s: rnd(0.85, 1.25), state: "idle", timer: rnd(0, 1), hp: 55, maxHp: 55, dead: false, hitFlash: 0, face: 1, seed: Math.random() * 10, hit: false });
    }

    G.gardenRooms = []; G.roomDoors = []; G.roomIdx = -1; G.gardenBeds = []; G.subDoors = [];

    G.gboss = { x: (GB_L + GB_R) / 2 + 120, hp: 700, maxHp: 700, state: "dormant", t: 0, cd: 2.2, rings: [], spikes: [], seeds: [], lunge: null, lower: 0, sink: 0, keyTaken: false, flash: 0, dead: false };
}

function updateGarden(dt){
    const p = G.player;
    for (const mp of G.gardenPlants) {
        if (mp.dead) continue;
        if (mp.sinkT != null) { if (G.t - mp.sinkT > 1.6) mp.dead = true; continue; }
        if (mp.hitFlash > 0) mp.hitFlash -= dt;
        const dx = p.x - mp.x, dist = Math.hypot(dx, p.hopY * 0.9);
        if (Math.abs(dx) > 900) continue;
        if (mp.state === "idle" || mp.state === "windup") mp.face = dx >= 0 ? 1 : -1;
        mp.timer -= dt;
        if (mp.state === "idle") { if (dist < 180 && mp.timer <= 0) { mp.state = "windup"; mp.timer = 0.65; playTone(jit(140), 0.4, 0.14 * VOL.robot, "sawtooth", 90); } }
        else if (mp.state === "windup") { if (mp.timer <= 0) { mp.state = "bite"; mp.timer = 0.22; mp.hit = false; playTone(jit(260), 0.1, 0.22 * VOL.robot, "square", 70); } }
        else if (mp.state === "bite") { if (!mp.hit && dist < 105 * mp.s) { damagePlayerHit(13); mp.hit = true; screenShakeKick(0.6); } if (mp.timer <= 0) { mp.state = "chew"; mp.timer = 1.3; } }
        else if (mp.state === "chew" && mp.timer <= 0) { mp.state = "idle"; mp.timer = 0.4; }
    }
    for (const l of G.lasers) {
        if (l.dead) continue;
        for (const mp of G.gardenPlants) {
            if (mp.dead || mp.sinkT != null || Math.abs(l.x - mp.x) > 30 || Math.abs(l.y - mp.d) > 28) continue;
            mp.hp -= p.dmg * (l.mult || 1); mp.hitFlash = 0.15; l.dead = true;
            if (mp.hp <= 0) { mp.dead = true; gainOmp(10); for (let i = 0; i < 18; i++) G.particles.push({ x: mp.x, y: mp.d - 40, vx: rnd(-3, 3), vy: rnd(-4, 1), life: 0.8, max: 0.8, color: i % 2 ? "#5fae3a" : "#b8234a", g: 0.15 }); }
            break;
        }
    }
}

function nbPages(){
    const pages = [{ intro: true, tab: 0 }];
    for (let tab = 0; tab < NB_TABS.length; tab++) for (const e of BESTIARY.filter(q => q.tab === tab)) {
        const L = NB_LORE[e.id] || [2, "—", e.notes || ""];
        pages.push({ e, part: 0, tab });
        if (L[3]) pages.push({ e, part: 1, tab });
    }
    if (pages.length % 2) pages.push({ blank: true, tab: NB_TABS.length - 1 });
    return pages;
}

    const p = G.player;

        for (const r of G.robots) if (!r.dead && Math.abs(r.x - p.x) < 650) discover(r.kind);
        if (G.locNow === "garden") { for (const mp of G.gardenPlants) if (!mp.dead && Math.abs(mp.x - p.x) < 600) { discover("plant"); break; } for (const m of G.gardenBeasts) if (!m.dead && Math.abs(m.x - p.x) < 600) discover(m.kind); if (G.gboss && Math.abs(G.gboss.x - p.x) < 1000) discover("gboss"); }

    if (G.state === "ARENA") { discover("dqopd"); if (G.miniCopies.length) discover("mini"); }
}
